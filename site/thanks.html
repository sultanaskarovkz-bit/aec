<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Заявка отправлена | AEC Kazakhstan</title>
<meta name="description" content="Заявка принята. Ответим в течение рабочего дня.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/aec.css?v=281028">
<link rel="stylesheet" href="assets/pages.css?v=281028">
<style>
.ok-box { max-width: 720px; margin-inline: auto; text-align: center; padding-block: clamp(40px, 6vw, 80px); }
.ok-box .ic { width: 72px; height: 72px; border-radius: 50%; background: var(--ok-l); color: var(--ok); display: grid; place-items: center; margin: 0 auto 20px; }
.ok-box .ic svg { width: 36px; height: 36px; }
.ok-box .lead { margin: 14px auto 0; }
.ok-box .sum { text-align: left; margin-top: 24px; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; background: var(--mist); font-size: 14px; }
.ok-box .sum b { color: var(--ink); }
.next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
@media (max-width: 640px) { .next { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
<main>
  <section class="section"><div class="wrap"><div class="ok-box">
    <span class="ic" id="okIc"></span>
    <h1>Заявка отправлена</h1>
    <p class="lead">Менеджер свяжется с вами в рабочее время в течение часа, КП подготовим в течение рабочего дня. Копия заявки ушла на e-mail отдела продаж и в WhatsApp менеджера.</p>
    <div class="sum" id="sum"></div>
    <div class="next" id="next"></div>
    <p class="small muted" style="margin-top:24px">Срочный вопрос? <a href="#" id="phone"></a> или <a href="#" id="wa" target="_blank" rel="noopener">WhatsApp</a></p>
  </div></div></section>
</main>
</div>
<script src="assets/catalog.js?v=281028"></script>
<script src="assets/data.js?v=281028"></script>
<script src="assets/i18n.js?v=281028"></script>
<script src="assets/aec.js?v=281028"></script>
<script>
(function () {
  const D = AEC, U = AECUI, I = U.icon, L = U.L, C = D.CONTACT;
  U.init({ active: '' });
  document.getElementById('okIc').innerHTML = I('check');
  const lead = U.store.get('lastLead', null);
  const s = document.getElementById('sum');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (lead) { s.innerHTML = `<b>Что мы получили</b><div style="margin-top:8px;display:grid;gap:4px">${[['Тип заявки', lead.formType], ['Имя', lead.name], ['Телефон', lead.phone], ['Компания', lead.company], ['Товар', lead.product], ['Комментарий', lead.comment], ['Время', lead.time]].filter(x => x[1]).map(x => `<span><span class="muted">${x[0]}:</span> ${esc(x[1])}</span>`).join('')}</div>`; } else { s.hidden = true; }
  document.getElementById('next').innerHTML = `<a class="btn btn-ghost" href="${L.cat('ibp')}">Каталог ИБП</a><a class="btn btn-ghost" href="${L.projects}">Проекты</a><a class="btn btn-ghost" href="${L.calc}">Калькулятор подбора</a>`;
  const ph = document.getElementById('phone'); ph.textContent = C.phone; ph.href = 'tel:+' + C.phoneRaw; document.getElementById('wa').href = C.whatsapp;
})();
</script>
</body>
</html>
