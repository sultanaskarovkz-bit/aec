<script>
(function () {
  const D = AEC, U = AECUI, I = U.icon, L = U.L;
  U.init({ active: 'company' });
  const prodBox = model => { const p = D.PRODUCTS.find(x => x.model === model); return p ? `<div class="inline-prod"><span class="pimg">${U.pphoto(p)}</span><span><b>${p.name}</b><small>${p.kva} ${D.unit(p.cat)} · ${p.phases ? p.phases + ' · ' : ''}${p.form} · ${D.fmtPrice(p.price)}</small></span><a class="btn btn-sm btn-primary" href="${L.product(p.slug)}">В каталог</a></div>` : ''; };
  const BODY = {
    0: `<p>Серверное оборудование чувствительно к любым отклонениям сети: провал напряжения на 20 мс приводит к перезагрузке, скачок выводит из строя блоки питания, а полное отключение без корректного завершения работы грозит потерей данных. Источник бесперебойного питания для серверной решает все три задачи, но только если выбран правильно. Ниже методика, по которой инженеры AEC подбирают ИБП для серверных и ЦОД в Казахстане.</p>
<h2 id="s1">Топология: только on-line</h2><p>Для серверного оборудования подходит только ИБП с двойным преобразованием (on-line). Он постоянно питает нагрузку от инвертора, формируя идеальную синусоиду 230 В 50 Гц, и переходит на батареи за 0 мс. Line-interactive ИБП переключаются с задержкой 4–8 мс и пропускают искажения сети, их место в офисах, но не в серверных. Все ИБП в каталоге AEC для серверных: Salicru SLC TWIN RT3, Kehua KR33, модульные SLC ADAPT2 и MR33 имеют on-line топологию.</p>
<h2 id="s2">Расчёт мощности</h2><p>Сложите потребление всех серверов, коммутаторов и систем хранения по паспортным данным или, лучше, по замерам под реальной нагрузкой. Разделите на коэффициент мощности нагрузки (для современных серверных блоков питания 0,9–1,0) и прибавьте запас 25–30 % на рост. Пример: 12 серверов по 450 Вт и сетевое оборудование 1,2 кВт дают 6,6 кВт; с PF 0,95 это 6,9 кВА, с запасом 30 % около 9 кВА. Подходит ИБП на 10 кВА.</p>${prodBox('SLC-10000-TWIN RT3')}
<h2 id="s3">Автономия и батареи</h2><p>Время работы от батарей зависит от того, есть ли на объекте дизельный генератор. С ДГУ достаточно 10–15 минут: этого хватает на запуск генератора и приём нагрузки через АВР. Без ДГУ закладывают 30–60 минут на корректное завершение работы серверов через ПО мониторинга. Количество и ёмкость батарей считают по разрядным таблицам производителя, предварительный расчёт даёт <a href="${L.calc}">калькулятор подбора</a>.</p>
<h2 id="s4">Стоечный или напольный</h2><p>До 10 кВА удобнее стоечные ИБП 2–3U, которые ставятся в серверную стойку вместе с батарейными модулями. От 10 до 40 кВА применяют напольные трёхфазные ИБП с внешними батарейными шкафами. От 20 кВА и при планах роста выгоднее модульные системы: мощность наращивается добавлением модулей, резервирование N+1 получается добавлением одного модуля, а ремонт сводится к замене модуля за 10 минут без остановки нагрузки.</p>${prodBox('SLC ADAPT2 50')}
<h2 id="s5">Мониторинг и завершение работы</h2><p>Для серверной обязательна SNMP-карта: она передаёт состояние ИБП в систему мониторинга (Zabbix, PRTG, DCIM) и инициирует корректное завершение работы серверов при низком заряде батарей. Для виртуализированных сред настраивают интеграцию с VMware и Hyper-V.</p>
<h2 id="s6">Типичные ошибки</h2><ul><li>Подбор по паспортной мощности серверов без замера: завышение в 2 раза и переплата.</li><li>Отсутствие запаса: через год нагрузка выросла, ИБП работает на пределе и уходит в байпас.</li><li>Батареи в тёплой серверной: при 30 °C срок службы AGM сокращается вдвое.</li><li>Нет сервисного байпаса: любое ТО требует остановки серверной.</li><li>Смешивание старых и новых батарей при замене.</li></ul>
<h2 id="s7">Итог</h2><p>ИБП для серверной: on-line, с запасом 25–30 %, автономией под сценарий объекта, SNMP-мониторингом и сервисным байпасом. Инженеры AEC подбирают конфигурацию бесплатно и предоставляют спецификацию для тендера. Складские модели 4–10 кВА отгружаем в Алматы в день оплаты.</p>`,
    1: `<p>Техническое обслуживание промышленных ИБП проводится по регламенту производителя и включает осмотр, замеры, чистку, тесты переходов и контроль батарей. Для систем свыше 10 кВА производители рекомендуют ТО дважды в год, для модульных систем и ЦОД ежеквартально.</p><h2 id="s1">Что входит в регламент</h2><ul><li>Визуальный осмотр: индикация, корпус, кабели, клеммы, следы перегрева.</li><li>Замеры: входные и выходные напряжения и токи, напряжение на каждой батарее, пульсации, температура.</li><li>Чистка от пыли, проверка и замена вентиляторов, протяжка соединений.</li><li>Тесты: переход на батареи, байпас, калибровка, контрольный разряд.</li><li>Анализ журнала событий, обновление прошивки.</li><li>Отчёт с замерами и прогнозом замены расходных узлов.</li></ul><h2 id="s2">Расходные узлы и сроки</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Узел</th><th>Срок замены</th><th>Признаки износа</th></tr></thead><tbody><tr><td>Батареи AGM</td><td>3–5 лет (long-life 10–12)</td><td>Сокращение автономии, вздутие, разброс напряжений</td></tr><tr><td>Вентиляторы</td><td>4–5 лет</td><td>Шум, перегрев, предупреждения</td></tr><tr><td>Конденсаторы DC-шины</td><td>7–10 лет</td><td>Пульсации, запах, уход в байпас</td></tr><tr><td>Конденсаторы AC</td><td>5–7 лет</td><td>Искажения выхода</td></tr></tbody></table></div><h2 id="s3">Сервисный договор</h2><p>Для объектов с несколькими ИБП выгоднее годовой договор: плановые ТО по графику, аварийный выезд с SLA, приоритет на запчасти. <a href="${L.service('service')}">Условия сервисного обслуживания AEC</a>.</p>`,
    2: `<p>Дизельная генераторная установка (ДГУ) состоит из дизельного двигателя, синхронного генератора (альтернатора), системы управления с контроллером, топливной системы, системы охлаждения и выхлопа, рамы или контейнера. Двигатель вращает альтернатор с частотой 1500 об/мин, обеспечивая 50 Гц на выходе.</p><h2 id="s1">Основные узлы</h2><ul><li>Двигатель: Cummins, Perkins, Volvo Penta, MTU, Scania, Deutz, Doosan, Baudouin, SDEC, YTO.</li><li>Альтернатор: Stamford AVK, Mecc Alte, Leroy-Somer.</li><li>Контроллер: Deep Sea, ComAp: автозапуск, защиты, мониторинг, синхронизация.</li><li>АВР: автоматический ввод резерва, переключение нагрузки за 10–15 секунд.</li></ul><h2 id="s2">Мощность PRP и ESP</h2><p>Основная мощность PRP (prime) для длительной работы с переменной нагрузкой и резервная ESP (standby) на 10 % выше для аварийного режима. Для резервирования здания выбирают по ESP, для автономного электроснабжения по PRP.</p><h2 id="s3">Исполнение</h2><p>Открытое для машинных залов, в шумозащитном кожухе (до 72 дБ на 7 м) для размещения у зданий, в контейнере с обогревом для удалённых объектов и северных регионов. <a href="${L.cat('dgu')}">Каталог ДГУ AEC</a>: Tescom, AGG Power, BAIFA от 10 до 3750 кВА.</p>`,
    3: `<p>AEC Kazakhstan принимает участие в международной выставке KIOGE 2026 в Алматы. На стенде: контейнерные ДГУ с АВР, промышленные ИБП Tescom TEOS, системы оперативного постоянного тока с батареями OPzV, демонстрация диагностики батарей анализатором Fluke VT521.</p><h2 id="s1">Что покажем</h2><ul><li>Решения электропитания для месторождений и НПС: контейнерные ДГУ 138–2500 кВА.</li><li>СОПТ 220 В DC: выпрямители N+1 и батареи на 20 лет.</li><li>Промышленные ИБП с трансформаторной развязкой.</li></ul><p>Приглашаем на стенд: инженеры ответят на вопросы по проектам и подготовят предварительный расчёт на месте. <a href="${L.solution('oil')}">Решения для нефтегаза</a>.</p>`,
    4: `<p>ИБП (источник бесперебойного питания, UPS) защищает оборудование от отключений, провалов и скачков напряжения, питая нагрузку от батарей на время аварии. Бесперебойник нужен везде, где перерыв питания означает потерю данных, брак, остановку процесса или угрозу безопасности: серверные, медицина, производство, банки, телеком, аварийные системы зданий.</p><h2 id="s1">Три типа ИБП</h2><ul><li>Off-line (резервный): переключение 10 мс, для компьютеров и бытовой техники.</li><li>Line-interactive: стабилизация AVR, переключение 4–8 мс, офисное оборудование.</li><li>On-line (двойное преобразование): 0 мс, идеальная синусоида, серверы, медицина, промышленность.</li></ul><h2 id="s2">Как выбрать</h2><p>Мощность с запасом 25–30 %, автономия под сценарий объекта, фазность по нагрузке, исполнение по месту установки. <a href="${L.calc}">Калькулятор подбора</a> считает за минуту.</p>`,
    5: `<p>Стабилизатор напряжения для дома нужен при просадках ниже 200 В и скачках выше 240 В, которые приводят к отказам котлов, холодильников и электроники. Выбор по трём параметрам: мощность всех потребителей с запасом 30 %, диапазон входного напряжения на объекте и тип регулирования.</p><h2 id="s1">Типы</h2><ul><li>Релейные: доступные, точность ±5–8 %, щелчки при переключении.</li><li>Электромеханические: точность ±1–3 %, выдерживают пусковые токи насосов и кондиционеров.</li><li>Электронные (тиристорные): без износа, быстрые, для электроники.</li></ul><p>Для дома с котлом и насосом подойдёт электромеханический стабилизатор 5–10 кВА, например EverExceed SVC-10000 со склада в Алматы. <a href="${L.cat('stab')}">Каталог стабилизаторов</a>.</p>`,
    6: `<p>Бесперебойность сложных производственных циклов, стабильность серверных стоек, жизнеобеспечение критической инфраструктуры опираются на выверенную архитектуру гарантированного электроснабжения. Для предприятий корпоративного уровня аварийная посадка напряжения либо кратковременный обрыв питающей линии создают прямую угрозу порчи дорогостоящего оборудования, срыва автоматизированных технологических процессов, колоссальных издержек. Сердцем любого масштабируемого комплекса бесперебойного электропитания выступает массив химических накопителей.</p>
<p>Отказоустойчивость батарейных шкафов, открытых стеллажей зависит не только от заводских параметров ячеек, но также от системного подхода к инжинирингу, регулярности превентивных проверок, соблюдения температурных карт. Комплексное техническое сопровождение позволяет продлить эффективный эксплуатационный ресурс элементов, оптимизировать совокупную стоимость владения (TCO) энергетическим комплексом.</p>
<h2>Методология расчета емкостных массивов для распределенных промышленных нагрузок</h2>
<p>Проектирование систем резервирования для сектора B2B исключает применение шаблонных решений. Корректный расчет требует углубленного аудита характера подключаемых потребителей, оценки пусковых перегрузок, коэффициента мощности, требований к продолжительности автономного режима. Инженеры AEC Kazakhstan формируют конфигурацию накопителей на базе точного моделирования переходных процессов в силовых цепях.</p>
<h3>Расчет времени автономии для дата-центров и телекоммуникационных узлов</h3>
<p>На объектах связи, в центрах обработки данных первостепенное значение приобретает способность силовых элементов отдавать максимальную мощность на коротких временных интервалах (от 5 до 15 минут). Данный отрезок времени критически необходим для запуска резервных дизель-генераторных установок, корректного переключения автоматического ввода резерва. Инженерный расчет фокусируется на минимизации внутреннего сопротивления шин постоянного тока, предотвращении просадки напряжения на входе инвертора при мгновенном набросе пиковой нагрузки.</p>
<h3>Специфика резервирования непрерывных производственных линий и клиник</h3>
<p>В металлургии, химической индустрии, высокотехнологичных медицинских блоках приоритеты смещаются в сторону длительной непрерывной автономии — от десятков минут до нескольких часов. Здесь критически важно учитывать влияние нелинейных нагрузок, пусковых токов электродвигателей, импульсных помех. Батарейные группы рассчитываются с запасом по токоотдаче, предотвращающим каскадный сбой смежных технологических переделов, обеспечивающим стабильное питание аппаратов лучевой диагностики, систем жизнеобеспечения.</p>
<h2>Технологический аудит электрохимических платформ для систем гарантированного питания</h2>
<p>Современная промышленная практика требует строгого соответствия типа химического источника конкретному профилю эксплуатации объекта.</p>
<h3>Сравнение свинцово-кислотных технологий при буферном дежурстве</h3>
<p>Герметизированные клапанно-регулируемые решения остаются востребованным стандартом благодаря отработанной схемотехнике, взвешенной стоимости:</p>
<ul>
<li><strong>Исполнение с пористым сепаратором (AGM):</strong> электролит удерживается в связанных микроволокнах, что дает минимальное внутреннее сопротивление, высокую скорость энергоотдачи при коротких разрядах.</li>
<li><strong>Исполнение с загущенным электролитом (GEL):</strong> кремниевый компаунд формирует стабильную структуру, повышая стойкость к глубоким циклическим разрядам, тепловым воздействиям в нестабильных сетях.</li>
</ul>
<h3>Применение литий-железо-фосфатных ячеек под контролем BMS</h3>
<p>Внедрение модулей на базе LiFePO4 обусловлено потребностью в сокращении занимаемой площади, снижении эксплуатационных расходов. Литий-железо-фосфатная химия выдерживает свыше 4500 циклов заряда-разряда, допускает ускоренный заряд высокими токами. Безопасность, долговечность таких сборок обеспечиваются активной системой управления (Battery Management System), которая осуществляет:</p>
<ol>
<li>Непрерывную поячеечную балансировку напряжения;</li>
<li>Многоточечный температурный контроль каждого силового блока;</li>
<li>Мгновенную противоаварийную защиту от перегрузок по току, коротких замыканий.</li>
</ol>
<h3>Использование щелочных накопителей в условиях жесткого климата</h3>
<p>Для удаленных распределительных подстанций, нефтегазовых промыслов, железнодорожной инфраструктуры Казахстана оптимальным выбором выступают никель-кадмиевые (Ni-Cd) сборки. Они способны безаварийно функционировать в диапазоне от -40 °C до +50 °C, не боятся глубоких переразрядов, устойчивы к вибрациям. Для сохранения проектной емкости регламент сервиса предусматривает регулярное проведение тренировочных циклов.</p>
<h2>Эксплуатационные регламенты и микроклиматическая стабилизация</h2>
<p>Даже самый надежный накопитель подвержен деградации при нарушении эксплуатационных параметров, установленных заводом-изготовителем.</p>
<h3>Термокомпенсация заряда и стабилизация микроклимата в машзалах</h3>
<p>Температурное поле аккумуляторного помещения выступает главным внешним фактором старения электрохимических систем. Эксплуатация свинцовых массивов при температуре свыше +25 °C сокращает расчетный ресурс практически вдвое на каждые 8–10 градусов превышения нормы из-за ускоренной коррозии решеток, высыхания связанной влаги. Для предотвращения износа интеллектуальные преобразователи настраиваются на термокомпенсацию буферного напряжения, снижая зарядный потенциал при нагреве среды.</p>
<h3>Аппаратная диагностика импеданса и контрольный разряд нагрузочным стендом</h3>
<p>Оценка технического состояния батарейных линеек силами сервисной службы AEC Kazakhstan включает передовые инструментальные методы:</p>
<ul>
<li><strong>Анализ динамического импеданса:</strong> высокоточное измерение внутреннего сопротивления миллиомметрами без вывода оборудования из работы позволяет заблаговременно выявить отдельные деградирующие блоки;</li>
<li><strong>Тестирование под проектной нагрузкой:</strong> проведение контрольного разряда с помощью специализированного мобильного нагрузочного модуля LOADEQ мощностью до 150 кВт позволяет верифицировать фактическую емкость всей цепочки в реальных рабочих условиях.</li>
</ul>
<h2>Безопасность эксплуатации высоковольтных сборок и регламенты вывода из работы</h2>
<p>Обслуживание промышленных систем постоянного тока высокого напряжения требует строгого соблюдения нормативов электробезопасности, охраны труда.</p>
<p>Инженерные бригады выполняют монтаж, сервис исключительно с применением диэлектрического инструмента, специализированных средств защиты, протоколов LOTO. Отработавшие ресурс элементы, содержащие цветные металлы, токсичные химические соединения, передаются на промышленную нейтрализацию в лицензированные центры. Глубокая вторичная переработка возвращает в производство до 95% свинца, кадмия, меди, сохраняя экологию региона. Комплексный подход AEC Kazakhstan гарантирует долговечность энергетических систем, непрерывность ключевых бизнес-процессов предприятий.</p>`,
    7: `<p>Мощность ИБП указывают в двух единицах: полная (кВА) и активная (кВт). Ошибка в их соотношении приводит либо к перегрузке источника, либо к переплате за запас, который никогда не используется. Разбираем, как считать нагрузку и какой запас закладывать.</p>
<h2>кВА, кВт и коэффициент мощности</h2><p>Полная мощность (кВА) описывает ток, который ИБП способен отдать, активная (кВт) описывает реальную работу, которую выполняет нагрузка. Связывает их коэффициент мощности: кВт = кВА × PF. У современных ИБП с двойным преобразованием выходной PF равен 1,0, то есть 100 кВА равны 100 кВт. У старых серий и у части однофазных моделей PF равен 0,8 или 0,9: ИБП на 10 кВА отдаст только 8 или 9 кВт.</p><p>Нагрузка тоже имеет свой коэффициент мощности. Серверные блоки питания с активной коррекцией работают с PF около 0,95–0,99, электродвигатели и трансформаторы имеют 0,7–0,85. Поэтому для подбора важно знать обе величины потребителей: и кВт, и кВА.</p>
<h2>Сбор нагрузки</h2><p>Сложите потребляемую мощность всего оборудования, которое должно работать от ИБП. Берите данные из паспортов или с заводских табличек, а не максимальные значения блоков питания: сервер с БП на 800 Вт в работе потребляет 300–450 Вт. Если есть возможность, замерьте фактическое потребление токовыми клещами или через PDU с измерением.</p><p>Отдельно выделите нагрузку с пусковыми токами: компрессоры, насосы, лифты, медицинские аппараты с конденсаторными накопителями. Пусковой ток двигателя в 3–7 раз выше номинального, ИБП должен держать такой бросок в режиме перегрузки или иметь запас по мощности.</p>
<h2>Запас на рост и на пусковые токи</h2><p>Стандартная практика для ИТ-нагрузки: запас 20–30 % к текущему потреблению. Для серверной, которую планируют расширять, закладывают 50 %, либо выбирают модульный ИБП и добавляют силовые модули по мере роста. Для нагрузки с двигателями запас считают по пусковым токам: ИБП должен выдерживать 150 % номинала в течение 30–60 секунд или иметь номинал, перекрывающий пусковой бросок.</p>
<h2>Фазность</h2><p>До 10–20 кВА обычно используют однофазные ИБП (вход и выход 220/230 В). От 10 кВА переходят на трёхфазные (380/400 В), потому что ток однофазной линии становится слишком большим для кабелей и автоматов. Трёхфазный ИБП с однофазным выходом (3/1) ставят, когда нагрузка однофазная, а подключение к сети трёхфазное.</p>
<h2>Время автономии</h2><p>Мощность и автономия считаются отдельно. Батареи подбирают под активную мощность (кВт) и требуемое время: 5–10 минут для корректного завершения работы или запуска генератора, 30–60 минут для объектов без ДГУ. Чем больше время, тем больше батарейных блоков и тем важнее температура в помещении: при +35 °C ресурс батарей сокращается вдвое по сравнению с +25 °C.</p>
<h2>Пример расчёта</h2><p>Серверная: 6 серверов по 400 Вт, два коммутатора по 150 Вт, система хранения 600 Вт. Итого 3,3 кВт при PF 0,95, то есть 3,5 кВА. С запасом 30 % нужно 4,5 кВА. Подходит однофазный ИБП 5–6 кВА с PF 1,0 в стоечном исполнении. Для автономии 30 минут потребуются внешние батарейные модули, их количество считает калькулятор на сайте или инженер AEC по вашим данным.</p>
<p>Чтобы не ошибиться с подбором, пришлите список оборудования или замеры нагрузки: мы рассчитаем мощность, фазность и автономию, предложим две-три модели из каталога с ценой и сроком поставки.</p>`,
    8: `<p>Батареи остаются самым уязвимым звеном системы бесперебойного питания: ИБП служит 10–15 лет, а батарейные блоки требуют замены несколько раз за этот срок. Рассказываем, сколько реально служат разные технологии и по каким признакам понять, что замена нужна уже сейчас.</p>
<h2>Проектный и реальный срок службы</h2><p>Производители указывают проектный срок службы в буферном режиме при +20…+25 °C: AGM общего назначения 3–5 лет, AGM long-life и GEL 10–12 лет, элементы OPzV и OPzS 15–20 лет. Реальный ресурс почти всегда меньше: каждые 8–10 °C сверх нормы сокращают его примерно вдвое. Батареи в шкафу ИБП без кондиционирования при +35 °C летом служат в полтора-два раза меньше паспортного срока.</p>
<h2>Что ещё сокращает ресурс</h2><ul><li>Глубокие разряды: частые отключения сети и работа до полного разряда ускоряют сульфатацию и потерю ёмкости.</li><li>Неверное напряжение буферного заряда: завышенное на 0,1 В на элемент вызывает перегрев и высыхание электролита, заниженное не позволяет полностью зарядить батарею.</li><li>Слабый элемент в линейке: линейка из 32–40 блоков работает по самому слабому, один повреждённый блок тянет за собой остальные.</li><li>Пульсации зарядного тока из-за неисправных конденсаторов ИБП.</li></ul>
<h2>Признаки, что батареи пора менять</h2><p>Время автономии заметно упало по сравнению с паспортным. ИБП выдаёт предупреждение о батарее или не проходит тест. Корпуса блоков вздулись, на клеммах появились следы окисления, в помещении чувствуется запах электролита. Любой из этих признаков означает, что батарея может не отработать ближайшее отключение сети.</p>
<h2>Как проверять без остановки нагрузки</h2><p>Измерение внутреннего сопротивления анализатором Fluke BT521 показывает состояние каждого блока за несколько минут и не требует отключения ИБП. Рост сопротивления на 25–30 % относительно нового блока означает деградацию. Контрольный разряд на нагрузочный модуль подтверждает фактическую ёмкость линейки, его проводят раз в год или перед ответственным периодом.</p>
<h2>Регламент</h2><p>Раз в полгода: визуальный осмотр, замер напряжения и сопротивления, проверка температуры. Раз в год: контрольный разряд, протяжка соединений, проверка настроек заряда. Результаты фиксируют в журнале по каждому блоку, чтобы видеть динамику и планировать замену заранее, а не после аварии.</p>
<h2>Замена</h2><p>Меняют всю линейку целиком: смешивать новые и старые блоки нельзя. Работы выполняют без остановки нагрузки через байпас ИБП. Старые батареи содержат свинец и кислоту, их передают на утилизацию лицензированной организации с оформлением акта. Сервисная служба AEC выполняет диагностику, подбор и замену батарей для ИБП любых брендов по Казахстану.</p>`,
    9: `<p>Дизельный генератор для бизнес-центра или торгового комплекса должен поддержать лифты, аварийное освещение, противопожарную автоматику, насосы и серверную в момент отключения сети. Разбираем, как выбрать мощность, исполнение и автоматику, чтобы установка запустилась и взяла нагрузку.</p>
<h2>Какую нагрузку резервировать</h2><p>Полный резерв здания редко оправдан. Обычно выделяют группу гарантированного питания: лифты, аварийное и эвакуационное освещение, пожарные насосы и вентиляция дымоудаления, СКУД и видеонаблюдение, серверная, иногда холодильное оборудование арендаторов. Эту группу подключают через отдельную секцию щита с автоматическим вводом резерва (АВР).</p>
<h2>Расчёт мощности</h2><p>Складывают активную мощность группы и учитывают пусковые токи. Лифт с частотным приводом запускается мягко, лифт с прямым пуском даёт бросок в 3–5 раз выше номинала. Для насосов и компрессоров запас считают по самому мощному двигателю, который запускается последним. Итоговую мощность берут в режиме резервной (ESP), а не основной (PRP) мощности: резервный режим допускает нагрузку до 100 % ограниченное время в году. В горной местности и при высокой температуре мощность снижают: выше 1000 м над уровнем моря двигатель теряет 3–4 % на каждые 300 м.</p>
<h2>Исполнение и размещение</h2><p>Открытое исполнение ставят в отдельном помещении с приточно-вытяжной вентиляцией, выхлопной трассой и топливным баком. Шумозащитный кожух снижает уровень шума до 65–75 дБ(А) на расстоянии 7 м и позволяет установить ДГУ на площадке или крыше. Контейнерное исполнение с отоплением и вентиляцией нужно для улицы при температурах ниже минус 20 °C. Для города обязательно учитывают санитарные нормы по шуму для жилой застройки.</p>
<h2>АВР и совместная работа с ИБП</h2><p>АВР контролирует напряжение сети и при пропадании даёт команду на запуск. Типичное время от команды до приёма нагрузки 10–15 секунд, поэтому серверная и системы безопасности работают от ИБП, который перекрывает этот интервал. Для корректной работы ИБП от генератора мощность ДГУ выбирают с запасом 1,5–2 раза относительно мощности ИБП, иначе выпрямитель ИБП будет видеть нестабильную частоту и не синхронизируется.</p>
<h2>Топливо и автономия</h2><p>Расход дизельного топлива при 75 % нагрузки составляет около 0,2–0,25 л на кВт·ч. Бак на 8 часов работы для ДГУ 200 кВА это порядка 300–400 литров. Для длительных отключений предусматривают внешний топливный резервуар и договор на доставку топлива.</p>
<h2>Обслуживание</h2><p>ДГУ, который стоит без работы месяцами, при отключении сети может не запуститься. Регламент требует еженедельного тестового запуска без нагрузки, ежемесячного запуска под нагрузкой, замены масла и фильтров по моточасам или раз в год, проверки стартерных батарей и подогрева блока цилиндров. Сервисный договор с AEC включает эти работы и выезд по заявке.</p>`,
    10: `<p>Рентгеновские аппараты, компьютерные и магнитно-резонансные томографы, ангиографы и оборудование операционных предъявляют к электропитанию требования, которые обычный серверный ИБП не выполняет. Разбираем, что учитывать при подборе ИБП для медицинского объекта.</p>
<h2>Импульсная нагрузка</h2><p>Рентгеновская трубка и генератор КТ потребляют энергию короткими импульсами: средняя мощность аппарата 20–40 кВА, пиковая в момент экспозиции в 3–5 раз выше. ИБП должен выдерживать такие броски без перехода на байпас и без просадки выходного напряжения. Подходят ИБП с двойным преобразованием и высокой перегрузочной способностью, при подборе запас берут по пиковой мощности из технического задания производителя аппарата, а не по средней.</p>
<h2>МРТ и криогенная система</h2><p>Магнит МРТ охлаждается жидким гелием, и компрессор криосистемы должен работать непрерывно. Потеря питания на несколько часов ведёт к испарению гелия и дорогостоящему восстановлению. Для МРТ резервируют не только градиентную систему, но и холодильную машину, а время автономии рассчитывают до запуска генератора плюс запас. Отдельное требование производителей: гальваническая развязка и качество заземления, поэтому часто ставят трансформаторные ИБП или разделительный трансформатор.</p>
<h2>Операционные и реанимация</h2><p>Для помещений группы 2 по электробезопасности (операционные, реанимация, палаты интенсивной терапии) нормы требуют медицинские системы изолированного питания (IPS) с контролем изоляции и питание от двух независимых источников с автоматическим переключением. ИБП в такой схеме стоит перед IPS-трансформатором, время переключения при пропадании сети не должно превышать 0,5 секунды для оборудования жизнеобеспечения.</p>
<h2>Резервирование</h2><p>Для КТ и МРТ обычно применяют схему с одним ИБП и внешним ручным байпасом для обслуживания. Для операционных блоков и реанимации ставят два ИБП в параллель или ИБП с резервной линией через STS. Модульные ИБП с резервированием N+1 позволяют заменить силовой модуль без остановки оборудования.</p>
<h2>Что нужно для подбора</h2><p>Пришлите технические требования производителя аппарата к электропитанию (мощность средняя и пиковая, фазность, допустимые отклонения), план помещения и данные о сети здания. Инженеры AEC подготовят схему подключения, спецификацию ИБП, батарей и трансформатора, при необходимости выполнят обследование электросети объекта. В портфеле AEC проекты для рентген-кабинетов, лабораторий и клиник в Алматы, Уральске и Караганде.</p>`,
    11: `<p>Для серверной от 20 кВА и ЦОД выбор стоит между моноблочным ИБП фиксированной мощности и модульной системой с силовыми модулями горячей замены. У каждого подхода своя экономика. Разбираем, когда переплата за модульность окупается.</p>
<h2>Как устроена модульная система</h2><p>Шкаф содержит общую шину, байпас, систему управления и слоты под силовые модули по 20–50 кВА. Мощность наращивают добавлением модулей, резервирование N+1 получают установкой одного модуля сверх расчётной нагрузки. Неисправный модуль заменяется за несколько минут без остановки нагрузки. Батареи общие для всех модулей.</p>
<h2>Моноблочный ИБП</h2><p>Один силовой блок на всю мощность. Проще, дешевле за кВА, меньше точек отказа внутри устройства. Для резервирования нужен второй такой же ИБП в параллель, то есть удвоение стоимости. Расширение мощности возможно только заменой или добавлением целого ИБП.</p>
<h2>Когда выгодна модульность</h2><ul><li>Нагрузка растёт поэтапно: сегодня 60 кВА, через два года 150 кВА. Покупаете шкаф на 150–200 кВА и три модуля, остальные добавляете позже.</li><li>Нужно резервирование N+1 без удвоения мощности: вместо двух моноблоков по 100 кВА ставите пять модулей по 25 кВА при нагрузке 100 кВА.</li><li>Критична скорость восстановления: запасной модуль на складе и замена силами персонала вместо вызова сервиса и недель ожидания платы.</li><li>Нагрузка сильно меняется в течение суток: система отключает лишние модули и держит КПД на уровне 96–97 % при малой нагрузке.</li></ul>
<h2>Когда достаточно моноблока</h2><p>Нагрузка стабильна и не вырастет, бюджет ограничен, объект обслуживается по сервисному договору с гарантированным временем выезда. Для 10–40 кВА моноблочный трёхфазный ИБП с внешним батарейным шкафом остаётся самым рациональным решением.</p>
<h2>Что ещё сравнить</h2><p>КПД в режиме двойного преобразования (у современных систем 96–97 %), наличие ECO-режима, размер шкафа и возможность доустановки батарей внутрь, протоколы мониторинга (SNMP, Modbus) для интеграции в систему диспетчеризации ЦОД, условия гарантии на модули и доступность запасных модулей на складе поставщика в Казахстане.</p>
<p>В каталоге AEC модульные системы Salicru SLC ADAPT2, Kehua MR33 и Tescom MTW на 30–1200 кВА и моноблочные ИБП Salicru, Kehua и Tescom на 10–800 кВА. Инженеры подберут конфигурацию под текущую нагрузку и план развития.</p>`,
    12: `<p>Станки с ЧПУ, обрабатывающие центры, лазерные и плазменные комплексы чувствительны к качеству напряжения сильнее бытовой техники: просадка на 10–15 % останавливает программу, скачок выводит из строя блоки питания и приводы. Разбираем, какой стабилизатор нужен производству и когда стабилизатора недостаточно.</p>
<h2>Какие проблемы сети бывают на производстве</h2><p>Длительное пониженное напряжение в конце смены или на удалённых площадках, перекос фаз из-за неравномерной однофазной нагрузки, провалы при пуске мощных двигателей и сварочных аппаратов, импульсные перенапряжения при коммутациях. Стабилизатор решает первые две задачи. От коротких провалов и импульсов защищает ИБП.</p>
<h2>Электромеханический или электронный</h2><p>Электромеханические (сервоприводные) стабилизаторы регулируют напряжение плавно, с точностью до ±1 %, и выдерживают кратные перегрузки при пуске двигателей. Их скорость реакции ниже, поэтому для оборудования с чувствительной электроникой выбирают электронные (тиристорные) стабилизаторы: они переключают отводы автотрансформатора за полпериода и не имеют изнашиваемых частей, но точность у них ступенчатая, обычно ±2–3 %. Релейные модели подходят для вспомогательной нагрузки, где точность не критична.</p>
<h2>Расчёт мощности</h2><p>Складывают номинальную мощность станков с учётом коэффициента мощности и пусковых токов шпинделей и гидростанций. Запас 30 % для электронных и 20 % для электромеханических моделей. Важно учитывать, что при входном напряжении на нижней границе диапазона выходная мощность стабилизатора снижается: для сети с просадкой до минус 25 % выбирают модель с запасом по мощности или с расширенным входным диапазоном.</p>
<h2>Трёхфазный с независимой регулировкой</h2><p>Для цеха с неравномерной нагрузкой по фазам нужен трёхфазный стабилизатор с независимым регулированием каждой фазы. Модели с общим регулированием выравнивают только среднее напряжение, и перекос сохранится.</p>
<h2>Когда нужен ИБП, а не стабилизатор</h2><p>Если потеря программы при провале сети на 20–50 мс означает брак детали или поломку инструмента, станок ставят на ИБП с двойным преобразованием, который сам выполняет функцию стабилизации. Стабилизатор при этом остаётся для остальной нагрузки цеха: освещения, вентиляции, компрессоров.</p>
<p>В каталоге AEC стабилизаторы Tescom TSVR и Salicru RE3 на 1–3200 кВА, электромеханические и электронные, однофазные и трёхфазные. Для подбора пришлите перечень оборудования и данные о сети: уровень напряжения в разное время суток и наличие перекоса фаз.</p>`,
    13: `<p>Если электричество отключают часто, автономная электростанция помогает пережить аварию без стресса: сохранить свет, связь, воду и работу важной техники. Ниже понятная инструкция, как подобрать генератор по мощности, типу топлива, фазности и дополнительным функциям, без привязки к конкретным моделям.</p><div class="note"><b>Быстрый подбор в три шага</b><ol style="margin:8px 0 6px"><li>Определите минимум техники, которая должна работать при отключении.</li><li>Сложите мощности и учтите пусковые токи.</li><li>Добавьте запас 20–30 %.</li></ol>Для чувствительной электроники (ноутбуки, зарядки, связь) удобны инверторные генераторы или связка «генератор + стабилизатор или ИБП».</div><h2>Основные критерии выбора электростанции</h2><p>Что важно в первую очередь:</p><ul><li><b>Мощность:</b> хватит ли её на всех одновременно работающих потребителей.</li><li><b>Тип топлива:</b> бензин для резерва и сезонной работы, дизель для долгой работы и высокой мощности.</li><li><b>Фазность:</b> 220 В или 380 В.</li><li><b>Качество тока:</b> для электроники важна стабильность напряжения.</li><li><b>Режим использования:</b> эпизодически или ежедневно по много часов.</li></ul><p>Начинайте не с вопроса «сколько кВт взять», а с ответа на вопрос, <b>что именно должно работать при отключении</b>. Для дачи это обычно свет, холодильник и связь, для дома ещё насос и котёл, для бизнеса критичная часть производства или ИТ-инфраструктуры.</p><p><b>Не берите впритык.</b> Запас по мощности снижает риск перегрузки при старте двигателей и позволяет подключить дополнительную технику.</p><h2>Какие потребители будут подключены к генератору</h2><h3>Активная нагрузка: свет и нагрев</h3><p>Потребители, которые в основном превращают электричество в тепло или свет. Серьёзных пусковых токов у них обычно нет:</p><ul><li>освещение, особенно светодиодное;</li><li>чайник, микроволновка, оборудование с ТЭНами;</li><li>электроника с импульсными блоками питания.</li></ul><h3>Реактивная нагрузка: двигатели и компрессоры</h3><p>Техника с электродвигателями при запуске кратковременно потребляет в 2–5 раз больше номинала:</p><ul><li>насосы и компрессоры;</li><li>холодильники и морозильники;</li><li>электроинструмент и станки.</li></ul><h3>Расчёт мощности подключаемых приборов</h3><ol><li>Составьте список техники, которая будет работать <b>одновременно</b>.</li><li>Сложите её мощности в ваттах или киловаттах по паспортам.</li><li>Для двигателей добавьте пусковой коэффициент, обычно от 2 до 5.</li><li>Прибавьте запас 20–30 % для стабильной работы.</li><li>Если планируется расширение нагрузки, закладывайте запас заранее.</li></ol><p>Холодильник, освещение и роутер составляют один класс задач. Холодильник, насос и электроинструмент уже совсем другой, и ему нужен заметно больший резерв.</p><figure style="margin:24px 0"><img src="assets/img/blog-gen-benzin-dizel.jpg" alt="Бензиновый или дизельный генератор: сравнение" loading="lazy" width="1200" height="800" style="width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line)"></figure><h2>Какой генератор лучше: бензиновый или дизельный</h2><h3>Бензиновый: резерв, сезон, выезды</h3><ul><li>обычно дешевле при равной мощности;</li><li>часто легче и компактнее;</li><li>удобен для дачи и редких отключений.</li></ul><p>Хороший выбор, если генератор включается по необходимости, а не работает каждый день по много часов.</p><h3>Дизельный: долгая работа и высокая мощность</h3><ul><li>обычно больше ресурс и долговечность;</li><li>рационален при длительной ежедневной работе;</li><li>его выбирают для задач от средней мощности и выше.</li></ul><p>Подходит, когда генератор становится регулярным источником энергии для объекта, стройки или предприятия.</p><p><b>Про электронику.</b> Если планируете питать ноутбуки, зарядные станции и чувствительные приборы, смотрите на качество выходного напряжения. В походах и для такой электроники часто выбирают инверторные генераторы: они дают более ровный ток.</p><figure style="margin:24px 0"><img src="assets/img/blog-gen-220-380.jpg" alt="Генератор 220 В или 380 В: какую фазу выбрать" loading="lazy" width="1200" height="800" style="width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line)"></figure><h2>Какую фазу выбрать: 220 В или 380 В</h2><h3>Однофазный генератор 220 В</h3><p>Подходит для большинства бытовых потребителей: свет, холодильник, телевизор, котёл, розетки.</p><ul><li>проще подключение;</li><li>часто дешевле и компактнее;</li><li>оптимален для дома и дачи.</li></ul><h3>Трёхфазный генератор 380 В</h3><p>Нужен, если есть трёхфазные потребители или разводка 3×380 В и оборудование под неё.</p><ul><li>нагрузку важно равномерно распределять по фазам;</li><li>перекос фаз может приводить к проблемам;</li><li>актуально для мастерских и производства.</li></ul><figure style="margin:24px 0"><img src="assets/img/blog-gen-kriterii.jpg" alt="Дополнительные критерии выбора электростанции: шум, бак, запуск, защита, охлаждение" loading="lazy" width="1200" height="800" style="width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line)"></figure><h2>Дополнительные критерии выбора электростанции</h2><h3>Шум</h3><p>Для дома и дачи смотрят на уровень шума, а также на наличие кожуха и глушителя.</p><h3>Бак и расход топлива</h3><p>Чем больше бак и экономичнее двигатель, тем дольше генератор работает без дозаправки.</p><h3>Запуск: ручной, электростартер, АВР</h3><p>Для дома удобен электростартер, а для автоматического резерва нужен АВР: он сам запускает генератор при пропадании сети.</p><h3>Защита</h3><ul><li>защита от перегрузки и короткого замыкания;</li><li>контроль уровня масла;</li><li>стабилизация выходного напряжения, в зависимости от типа генератора.</li></ul><h3>Охлаждение: воздушное или жидкостное</h3><p>Воздушное чаще у переносных моделей. Жидкостное обычно встречается у стационарных решений для длительной нагрузки.</p><h2>Подбор генератора по месту применения</h2><h3>Дом и дача: резерв на базовые нужды</h3><ul><li>минимум: свет, холодильник, связь, насос и котёл, если нужны;</li><li>важны шум и простота обслуживания;</li><li>часто выбирают бензиновый или инверторный вариант.</li></ul><h3>Стройка и бригады: инструмент и жёсткие условия</h3><ul><li>рамная конструкция и защищённость;</li><li>большой бак на смену;</li><li>обязателен запас на пусковые токи электроинструмента.</li></ul><h3>Отдых и путешествия: мобильность и ровный ток</h3><ul><li>малый вес и компактность;</li><li>удобно для зарядок, ноутбуков, электроники;</li><li>часто выбирают инверторные генераторы.</li></ul><h3>Предприятия и большие объекты: длительная работа и мощность</h3><ul><li>обычно дизельные решения;</li><li>важны ресурс, охлаждение и сервис;</li><li>часто нужен АВР и правильная схема подключения.</li></ul><p>Для объектов AEC поставляет <a href="${L.cat('dgu')}">дизельные генераторы</a> открытого исполнения, в кожухе и в контейнере, с АВР, а также выполняет <a href="${L.service('montazh')}">монтаж и пусконаладку</a>. Мощность с учётом пусковых токов можно рассчитать в <a href="${L.calc}#dgu">калькуляторе подбора ДГУ</a>.</p><h2>Вопросы и ответы</h2><h3>Как понять, какой мощности нужен генератор?</h3><p>Сложите мощности приборов, которые будут работать одновременно, добавьте коэффициент на пусковые токи двигателей и сделайте запас 20–30 %.</p><h3>Что лучше для дома: бензин или дизель?</h3><p>Для редкого резервного использования часто выбирают бензин. Если генератор будет работать долго и регулярно, чаще смотрят в сторону дизеля.</p><h3>Нужен ли генератор на 380 В, если в доме всё на 220 В?</h3><p>Обычно нет. Трёхфазный генератор берут под трёхфазное оборудование или разводку 3×380 В.</p><h3>Как защитить электронику при питании от генератора?</h3><p>Ориентируйтесь на качество выходного напряжения: для электроники удобны инверторные генераторы или связка с дополнительной стабилизацией или ИБП.</p>`
  };
  function render() {
    const i = parseInt(U.hashParts()[0] || '0', 10) || 0; const a = D.ARTICLES[i] || D.ARTICLES[0];
    const crumbs = [{ name: 'Главная', href: L.home }, { name: 'Блог', href: L.blog }, { name: a.title }];
    document.getElementById('hero').innerHTML = U.crumbs(crumbs) + `<h1>${a.title}</h1><div class="meta"><span class="badge badge-accent">${a.cat}</span><span>${U.fmtDate(a.date)}</span><span>${a.read} мин чтения</span><span>Инженеры AEC</span></div>`;
    const body = BODY[i] || BODY[0]; document.getElementById('body').innerHTML = body + `<div class="author"><span class="av">AEC</span><div><b>Инженерная служба AEC Kazakhstan</b><div class="small muted">Технические данные проверены сервисным отделом. Вопросы по статье: ${D.CONTACT.email}</div></div></div>`;
    const hs = [...document.querySelectorAll('#body h2')]; hs.forEach((h, k) => { if (!h.id) h.id = 's' + (k + 1); }); document.getElementById('toc').innerHTML = hs.length ? `<b>Содержание</b><ol>${hs.map(h => `<li><a href="#${h.id}" onclick="document.getElementById('${h.id}').scrollIntoView({behavior:'smooth'});return false;">${h.textContent}</a></li>`).join('')}</ol>` : '';
    document.getElementById('side').innerHTML = `<h3>По теме статьи</h3><a class="btn btn-primary btn-block" href="${L.calc}">Калькулятор подбора</a><a class="btn btn-ghost btn-block" href="${L.cat('ibp')}">Каталог ИБП</a><a class="btn btn-ghost btn-block" href="${L.service('service')}">Сервисное обслуживание</a><button class="btn btn-kp btn-block" data-open-modal data-title="Вопрос эксперту" data-type="Вопрос эксперту (статья)" data-product="${a.title}">Задать вопрос инженеру</button>`;
    document.getElementById('similar').innerHTML = D.ARTICLES.map((x, k) => ({ x, k })).filter(o => o.k !== i).slice(0, 3).map(o => `<a class="post" href="${L.article(o.k)}">${o.x.cover ? `<span class="cover">${U.img(o.x.cover, o.x.title, '', 'data-ph="bg"')}</span>` : ''}<div class="meta"><span class="badge">${o.x.cat}</span><span>${U.fmtDate(o.x.date)}</span></div><h3>${o.x.title}</h3><span class="more">Читать</span></a>`).join('');
    document.title = U.fit([a.title + ' | Блог AEC', a.title]);
    document.querySelector('meta[name=description]').setAttribute('content', U.clip(document.querySelector('#body p').textContent));
    document.querySelectorAll('script[type="application/ld+json"]').forEach(x => x.remove());
    U.jsonld({ '@context': 'https://schema.org', '@graph': [{ '@type': 'BreadcrumbList', itemListElement: crumbs.map((c, k) => ({ '@type': 'ListItem', position: k + 1, name: c.name, item: c.href ? new URL(c.href, location.href).href : location.href })) }, { '@type': 'Article', headline: a.title, datePublished: a.date, dateModified: a.date, author: { '@type': 'Organization', name: 'AEC Kazakhstan' }, publisher: { '@id': 'https://aecups.kz/#org' }, articleSection: a.cat }] });
    U.render(); window.scrollTo({ top: 0 });
  }
  render(); window.addEventListener('hashchange', () => { if (/^#\d+$/.test(location.hash) || !location.hash) render(); });
})();
</script>
