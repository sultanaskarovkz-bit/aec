<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Документация и datasheet | AEC Kazakhstan</title>
<meta name="description" content="Библиотека PDF: каталоги и datasheet ИБП Salicru, Kehua, Tescom, батарей Hoppecke, BAE, Ritar, EnerGrid, ДГУ AGG и BAIFA, стабилизаторов. Сертификаты ЕАЭС и дистрибьюторские письма. Фильтр по бренду и типу оборудования.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/aec.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div id="app">
<main>
  <section class="page-hero"><div class="grid-bg"></div><div class="wrap" id="hero"></div></section>
  <section class="section-tight"><div class="wrap">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><div class="filters-row" id="fType" style="margin:0"></div></div>
    <div class="filters-row" id="fBrand"></div>
    <div class="field" style="max-width:360px;margin-bottom:16px"><input class="input" id="q" placeholder="Поиск по названию или модели"></div>
    <p class="muted small" id="count"></p>
    <div id="list"></div>
  </div></section>
  <section class="section bg-mist"><div class="wrap"><div class="cta-band"><div><h2>Нужен datasheet, которого нет в библиотеке?</h2><p>Пришлём документацию по любой модели из каталога и под заказ, а также полный пакет сертификатов для тендера.</p></div><div><button class="btn btn-light btn-lg" data-open-modal data-title="Запрос документации" data-type="Запрос документации">Запросить документы</button></div></div></div></section>
</main>
</div>
<script src="assets/catalog.js"></script>
<script src="assets/data.js"></script>
<script src="assets/aec.js"></script>
<script>
(function () {
  const D = AEC, U = AECUI, I = U.icon, L = U.L;
  U.init({ active: 'company' });
  const crumbs = [{ name: 'Главная', href: L.home }, { name: 'Документация' }];
  document.getElementById('hero').innerHTML = U.crumbs(crumbs) + `<h1>Документация: каталоги, datasheet, сертификаты</h1><p class="lead">Библиотека PDF по оборудованию из каталога AEC. Фильтр по типу и бренду, поиск по модели. Документы скачиваются без регистрации.</p>`;
  const TYPES = { ds: 'Datasheet', cat: 'Каталог', man: 'Руководство', cert: 'Сертификат', dist: 'Дистрибьюторское письмо' };
  const docs = [];
  const seen = new Set();
  D.PRODUCTS.forEach(p => { const k = p.brand + p.series; if (seen.has(k)) return; seen.add(k); docs.push({ t: 'ds', brand: p.brand, name: 'Datasheet ' + p.brand + ' ' + p.series, sub: D.cat(p.cat).name + ' · ' + p.series, size: (1 + Math.round((p.series.length % 5) * 0.7 * 10) / 10).toFixed(1).replace('.', ',') + ' МБ', cat: p.cat }); });
  [['cat', 'Salicru', 'Каталог Salicru 2026: ИБП, стабилизаторы', 'Общий каталог', '12,4 МБ'], ['cat', 'Tescom', 'Каталог Tescom: ИБП, ДГУ, стабилизаторы, STS', 'Общий каталог', '18,2 МБ'], ['cat', 'Kehua', 'Каталог Kehua Tech: ИБП и решения для ЦОД', 'Общий каталог', '9,8 МБ'], ['man', 'Salicru', 'Руководство по эксплуатации SLC ADAPT2', 'Модульные ИБП', '6,1 МБ'], ['man', 'Salicru', 'Руководство по эксплуатации SLC TWIN RT3', 'Стоечные ИБП', '3,4 МБ'], ['man', 'Tescom', 'Руководство по эксплуатации TEOS', 'Трансформаторные ИБП', '5,2 МБ'], ['cert', 'Salicru', 'Сертификат соответствия ЕАЭС: ИБП Salicru SLC', 'ТР ТС 004/2011, 020/2011', '0,8 МБ'], ['cert', 'Tescom', 'Сертификат соответствия ЕАЭС: ИБП Tescom TEOS, MTW, NEOLINE', 'ТР ТС 004/2011, 020/2011', '0,9 МБ'], ['cert', 'Kehua', 'Сертификат соответствия ЕАЭС: ИБП Kehua KR, MR', 'ТР ТС 004/2011, 020/2011', '0,7 МБ'], ['dist', 'Salicru', 'Дистрибьюторское письмо Salicru для AEC Kazakhstan', '2026 год', '0,4 МБ'], ['dist', 'Tescom', 'Дистрибьюторское письмо Tescom для AEC Kazakhstan', '2026 год', '0,4 МБ'], ['dist', 'Kehua', 'Партнёрский сертификат Kehua Tech', '2026 год', '0,3 МБ']].forEach(d => docs.push({ t: d[0], brand: d[1], name: d[2], sub: d[3], size: d[4] }));
  const brands = [...new Set(docs.map(d => d.brand))];
  const st = { t: '', b: '', q: '' };
  function render() {
    document.getElementById('fType').innerHTML = `<button class="${st.t ? '' : 'on'}" data-k="t" data-v="">Все документы</button>` + Object.entries(TYPES).map(e => `<button class="${st.t === e[0] ? 'on' : ''}" data-k="t" data-v="${e[0]}">${e[1]}</button>`).join('');
    document.getElementById('fBrand').innerHTML = `<button class="${st.b ? '' : 'on'}" data-k="b" data-v="">Все бренды</button>` + brands.map(b => `<button class="${st.b === b ? 'on' : ''}" data-k="b" data-v="${b}">${b}</button>`).join('');
    const q = st.q.toLowerCase();
    const list = docs.filter(d => (!st.t || d.t === st.t) && (!st.b || d.brand === st.b) && (!q || (d.name + ' ' + d.sub).toLowerCase().includes(q)));
    document.getElementById('count').textContent = list.length + ' документов';
    document.getElementById('list').innerHTML = list.map(d => `<div class="doc-row"><span class="ic">${I(d.t === 'cert' || d.t === 'dist' ? 'award' : 'file')}</span><div><b>${d.name}</b><small>${TYPES[d.t]} · ${d.brand} · ${d.sub} · PDF, ${d.size}</small></div><a class="btn btn-ghost btn-sm" href="#" onclick="AECUI.toast('В рабочей версии начнётся скачивание PDF');return false;">${I('download')} Скачать</a></div>`).join('') || '<p class="muted">Ничего не найдено. Запросите документ через форму ниже.</p>';
  }
  document.addEventListener('click', e => { const b = e.target.closest('.filters-row button'); if (!b) return; st[b.dataset.k] = b.dataset.v; render(); });
  document.getElementById('q').addEventListener('input', e => { st.q = e.target.value; render(); });
  render();
  U.jsonld({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: crumbs.map((c, i) => ({ '@type': 'ListItem', position: i + 1, name: c.name, item: c.href ? new URL(c.href, location.href).href : location.href })) });
})();
</script>
</body>
</html>
