<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Правовая информация | AEC Kazakhstan</title>
<meta name="description" content="Политика конфиденциальности, пользовательское соглашение, публичная оферта, гарантии и возврат. ТОО «AEC Kazakhstan».">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/aec.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div id="app">
<main>
  <section class="page-hero"><div class="grid-bg"></div><div class="wrap" id="hero"></div></section>
  <section class="section-tight"><div class="wrap"><div class="legal-nav" id="nav"></div><div class="article" id="body"></div></div></section>
</main>
</div>
<script src="assets/data.js"></script>
<script src="assets/aec.js"></script>
<script>
(function () {
  const D = AEC, U = AECUI, L = U.L, C = D.CONTACT;
  U.init({ active: 'company' });
  const P = {
    policy: ['Политика конфиденциальности', `<p>Настоящая политика определяет порядок обработки и защиты персональных данных пользователей сайта aecups.kz в соответствии с Законом Республики Казахстан «О персональных данных и их защите» от 21 мая 2013 года № 94-V.</p><h2>1. Оператор</h2><p>${C.legal}, БИН ${C.bin}, ${C.address}, e-mail ${C.email}.</p><h2>2. Какие данные собираются</h2><p>Имя, телефон, e-mail, название компании, БИН, город, содержание сообщения и прикреплённые файлы, которые пользователь указывает в формах сайта; технические данные: IP-адрес, cookie, данные аналитики Google Analytics.</p><h2>3. Цели обработки</h2><p>Подготовка коммерческих предложений, консультации, выполнение заявок на сервис, информирование о статусе заказа, улучшение работы сайта.</p><h2>4. Согласие</h2><p>Отправляя форму на сайте, пользователь даёт согласие на обработку персональных данных в указанных целях. Согласие может быть отозвано письмом на ${C.email}.</p><h2>5. Хранение и защита</h2><p>Данные хранятся на защищённых серверах, доступ имеют только уполномоченные сотрудники. Срок хранения: до достижения целей обработки или отзыва согласия.</p><h2>6. Cookie</h2><p>Сайт использует cookie для аналитики и корректной работы. Пользователь может отключить cookie в настройках браузера.</p><p class="muted small">Окончательный текст политики предоставляет юрист Заказчика. Редакция от 2026 года.</p>`],
    terms: ['Пользовательское соглашение', `<p>Используя сайт aecups.kz, пользователь принимает условия настоящего соглашения.</p><h2>1. Информация на сайте</h2><p>Характеристики, цены и наличие носят информационный характер и уточняются в коммерческом предложении. Цены указаны в тенге без НДС, если не указано иное.</p><h2>2. Интеллектуальная собственность</h2><p>Тексты, изображения, схемы и расчёты калькулятора принадлежат ${C.legal}. Копирование без согласия запрещено.</p><h2>3. Ответственность</h2><p>Расчёты калькулятора являются предварительными и требуют проверки инженером. Компания не несёт ответственности за решения, принятые на основе предварительного расчёта без согласования.</p><p class="muted small">Окончательный текст предоставляет юрист Заказчика.</p>`],
    offer: ['Публичная оферта', `<p>${C.legal} предлагает юридическим и физическим лицам заключить договор поставки оборудования и оказания услуг на условиях настоящей оферты.</p><h2>1. Предмет</h2><p>Поставка ИБП, ДГУ, аккумуляторных батарей, стабилизаторов и сопутствующего оборудования, оказание услуг монтажа, пусконаладки и сервиса.</p><h2>2. Порядок заказа</h2><p>Заявка через сайт, телефон или e-mail; коммерческое предложение; счёт; оплата; поставка. Акцептом оферты является оплата счёта.</p><h2>3. Цены и оплата</h2><p>Цены в тенге. Условия оплаты указываются в счёте: предоплата для складских позиций, поэтапная оплата для проектных поставок.</p><h2>4. Поставка</h2><p>Со склада в Алматы или напрямую с завода производителя. Сроки указываются в КП.</p><h2>5. Гарантия</h2><p>Заводская гарантия производителя 12–36 месяцев в зависимости от оборудования, гарантия на работы 6 месяцев.</p><p class="muted small">Окончательный текст предоставляет юрист Заказчика.</p>`],
    warranty: ['Гарантии и возврат', `<h2>Гарантия на оборудование</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Оборудование</th><th>Гарантия</th></tr></thead><tbody><tr><td>ИБП Salicru</td><td>24 месяца</td></tr><tr><td>ИБП Kehua KR</td><td>24 месяца</td></tr><tr><td>ИБП Kehua MR33 (модульные)</td><td>36 месяцев</td></tr><tr><td>ИБП Tescom</td><td>24 месяца</td></tr><tr><td>Дизельные генераторы</td><td>12 месяцев или 1000 моточасов</td></tr><tr><td>Аккумуляторные батареи AGM</td><td>12–24 месяца</td></tr><tr><td>Батареи OPzV / OPzS</td><td>24 месяца</td></tr><tr><td>Стабилизаторы</td><td>12–24 месяца</td></tr></tbody></table></div><h2>Условия</h2><p>Гарантия действует при соблюдении условий эксплуатации по паспорту: температура, вентиляция, качество сети, регламентное ТО. Пусконаладка силами AEC или сертифицированного партнёра сохраняет гарантию в полном объёме.</p><h2>Гарантия на работы</h2><p>6 месяцев на монтаж, пусконаладку, ремонт и установленные запчасти.</p><h2>Возврат</h2><p>Складские позиции без следов эксплуатации в заводской упаковке принимаются к возврату в течение 14 дней. Оборудование, поставленное под проект, возврату не подлежит, кроме случаев заводского брака.</p><h2>Как обратиться по гарантии</h2><p>Телефон ${C.phone}, WhatsApp или e-mail ${C.email}: укажите модель, серийный номер, описание неисправности и фото. Выезд инженера по Алматы в день обращения.</p>`]
  };
  function render() {
    const id = U.hashParts()[0] || 'policy'; const p = P[id] || P.policy;
    const crumbs = [{ name: 'Главная', href: L.home }, { name: p[0] }];
    document.getElementById('hero').innerHTML = U.crumbs(crumbs) + `<h1>${p[0]}</h1>`;
    document.getElementById('nav').innerHTML = Object.keys(P).map(k => `<a class="btn btn-sm ${k === id ? 'btn-primary' : 'btn-ghost'}" href="legal.html#${k}">${P[k][0]}</a>`).join('');
    document.getElementById('body').innerHTML = p[1];
    document.title = p[0] + ' | AEC Kazakhstan'; window.scrollTo({ top: 0 });
  }
  render(); window.addEventListener('hashchange', render);
})();
</script>
</body>
</html>
