<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бренд | AEC Kazakhstan</title>
<meta name="description" content="Страница бренда: описание производителя, статус AEC, линейки продукции, товары в каталоге, проекты.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/aec.css?v=281028">
<link rel="stylesheet" href="assets/pages.css?v=281028">
<style>
.lines { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.line { border: 1px solid var(--line); border-radius: var(--r); padding: 18px; background: #fff; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.line:hover { border-color: var(--blue); color: var(--ink); }
.line b { font-family: var(--font-display); font-size: 17px; }
.line small { color: var(--muted); font-size: 13px; }
.line img, .line svg { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
@media (max-width: 860px) { .lines { grid-template-columns: 1fr; } }
.lg-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 5vw, 64px); color: #fff; letter-spacing: -.02em; line-height: 1; }
</style>
</head>
<body>
<div id="app">
<main>
  <section class="page-hero"><div class="grid-bg"></div><div class="wrap page-hero-grid"><div id="hero"></div><div class="art" id="heroArt" style="text-align:center"></div></div></section>
  <section class="section-tight"><div class="wrap"><div class="side"><div class="article" style="max-width:none" id="about"></div><aside class="side-box" id="side"></aside></div></div></section>
  <section class="section bg-mist" id="linesSec"><div class="wrap"><div class="sec-head"><div><h2>Линейки продукции</h2></div></div><div class="lines" id="lines"></div></div></section>
  <section class="section"><div class="wrap"><div class="sec-head"><div><h2 id="prodTitle"></h2></div><a class="more" id="prodMore" href="catalog.html">Все в каталоге</a></div><div class="pgrid" id="prods"></div></div></section>
  <section class="section bg-mist"><div class="wrap"><div class="sec-head"><div><h2>Проекты с этим оборудованием</h2></div><a class="more" href="projects.html">Все проекты</a></div><div class="pj-grid" id="pj"></div></div></section>
</main>
</div>
<script src="assets/catalog.js?v=281028"></script>
<script src="assets/data.js?v=281028"></script>
<script src="assets/i18n.js?v=281028"></script>
<script src="assets/aec.js?v=281028"></script>
<script>
(function () {
  const D = AEC, U = AECUI, I = U.icon, L = U.L;
  U.init({ active: 'company' });
  const ABOUT = {
    salicru: ['Salicru: испанский производитель ИБП с 1965 года', '<p>Salicru S.A. основана в 1965 году в Барселоне и производит источники бесперебойного питания, стабилизаторы и инверторы на собственном заводе в Испании. Линейка ИБП покрывает диапазон от 700 ВА до 1500 кВА: стоечные SLC TWIN RT для серверных, трёхфазные SLC TWIN PRO3, модульные SLC ADAPT2 с горячей заменой модулей 25 и 50 кВА.</p><p>AEC Kazakhstan: официальный дистрибьютор Salicru в Казахстане. Складская программа в Алматы: SLC TWIN RT2/RT3 4–10 кВА, SLC TWIN PRO3 20 кВА, модули ADAPT2 50 кВА. Заводская гарантия 24 месяца, оригинальные запчасти, обучение инженеров на заводе.</p>'],
    tescom: ['Tescom: турецкий производитель ИБП, ДГУ и стабилизаторов', '<p>Tescom Elektronik выпускает оборудование гарантированного электропитания с 1983 года: трансформаторные ИБП TEOS для промышленности и медицины, модульные MTW, электромеханические стабилизаторы TSVR до 3200 кВА, статические переключатели STS и дизельные генераторные установки на двигателях Perkins, Volvo Penta, Baudouin, Doosan.</p><p>AEC Kazakhstan: официальный дистрибьютор Tescom. Проекты: модульный ИБП MTW 300 кВА для лаборатории в Караганде, TEOS 80 кВА для рентген-кабинетов в Уральске.</p>'],
    'kehua-tech': ['Kehua Tech: модульные ИБП и решения для ЦОД', '<p>Kehua Tech (Сямынь, Китай) с 1988 года производит ИБП, модульные системы для ЦОД и солнечные инверторы, входит в тройку крупнейших производителей ИБП мира по объёму. Серии KR11 (1–10 кВА), KR33 (10–120 кВА), модульные MR33 (25–600 кВА) с КПД до 96,5 %.</p><p>AEC Kazakhstan: официальный партнёр. Проект: ИБП Kehua 120 кВА для офиса Air Astana в Алматы.</p>'],
    hoppecke: ['Hoppecke: немецкие стационарные батареи', '<p>Hoppecke Batterien (Германия, с 1927 года): промышленные аккумуляторы OPzS и OPzV grid power для телеком, ЦОД, энергетики и железной дороги. Срок службы OPzV до 18–20 лет при 20 °C.</p><p>AEC поставляет Hoppecke под проекты СОПТ, телеком-узлов и ЦОД, выполняет монтаж батарейных стеллажей и ввод в эксплуатацию.</p>'],
    'bae-batterien': ['BAE Batterien: батареи Secura из Берлина', '<p>BAE Batterien GmbH (Берлин, с 1899 года): стационарные батареи Secura OPzS, OPzV и OGi для энергетики, телекоммуникаций и систем бесперебойного питания. Проектный срок службы OPzV до 18 лет.</p><p>Складская позиция AEC: BAE Secura 6 OPzV 420 для систем оперативного тока.</p>'],
    energrid: ['EnerGrid: AGM-батареи для ИБП', '<p>EnerGrid: аккумуляторы AGM общего назначения GP и front-terminal FT 12 В 7–200 А·ч для ИБП, телеком-стоек и аварийных систем. Срок службы до 10 лет.</p><p>Складская программа AEC в Алматы: GP1272, FT12-100, FT12-150, FT12-200.</p>'],
    ritar: ['Ritar: батареи для ИБП со склада в Алматы', '<p>Ritar Power: AGM-батареи RT и RA 12 В 7–100 А·ч, серия HR с повышенной отдачей для ИБП. Срок службы 10–12 лет (long-life).</p><p>Складская программа AEC: RT1270, RT12180, RA12-65, RA12-100. Отгрузка в день оплаты.</p>']
  };
  const LINES = {
    salicru: [['SLC TWIN RT2 / RT3', 'Однофазные Rack/Tower 0,7–10 кВА', 'SLC TWIN RT3'], ['SLC TWIN PRO3', 'Трёхфазные 10–20 кВА', 'SLC TWIN PRO3'], ['SLC ADAPT2', 'Модульные, шкафы до 1500 кВА', 'SLC ADAPT2'], ['SLC CUBE3+ / CUBE4', 'Трёхфазные 7,5–200 кВА', 'SLC CUBE3+'], ['SLC X-PERT / X-TRA', 'Трёхфазные 80–800 кВА', 'SLC X-TRA'], ['RE3 / EMi3', 'Стабилизаторы напряжения', 'RE3 T']],
    tescom: [['MTW', 'Модульные ИБП 30–600 кВА', 'MTW'], ['NEOLINE', 'Трёхфазные ИБП', 'NEOLINE'], ['TSC', 'Однофазные ИБП 6–20 кВА', 'TSC'], ['TSVR', 'Стабилизаторы 1–3200 кВА', 'TSVR'], ['STS2000 / 3000 / 4000', 'Статические переключатели 32–1250 А', 'STS4000'], ['TDJ', 'ДГУ 11–1250 кВА', 'TDJ (Perkins)']],
    'kehua-tech': [['KR11 Plus', 'Однофазные 1–10 кВА', 'KR11 Plus'], ['KR-RM', 'Стоечные 1–40 кВА', 'KR-RM'], ['KR33 / KR33-H', 'Трёхфазные моноблочные', 'KR33'], ['MY', 'Трёхфазные 10–200 кВА', 'MY'], ['MR33', 'Модульные 120–1200 кВА', 'MR33'], ['FR-UK', 'С гелевыми батареями', 'FR-UK']],
    hoppecke: [['grid power V H', '2 В, высокая отдача тока', 'grid power V H'], ['grid power VR M', 'OPzV 2 В', 'grid power VR M'], ['OPzS', '2 В 200–3250 А·ч', 'OPzS'], ['OPzV', '2 В 200–3000 А·ч', 'OPzV']],
    'bae-batterien': [['Secura OPzV', '2 В и 12 В', 'Secura OPzV'], ['Secura OPzS', '2 В и 12 В', 'Secura OPzS'], ['Secura OGi / OGiV', 'Пластинчатые элементы', 'Secura OGi']],
    energrid: [['GP / GPL', '12 В AGM общего назначения', 'GPL'], ['FT', 'Front terminal 12 В', 'FT'], ['HR / HRL', 'High rate для ИБП', 'HRL']],
    ritar: [['RA / RT', '12 В 7–100 А·ч', 'RA'], ['HR', 'High rate', 'HR']],
    everexceed: [['SVC', 'Однофазные электромеханические', 'SVC'], ['SBW', 'Трёхфазные 20–1000 кВА', 'SBW'], ['TNS', 'Трёхфазные', 'TNS']],
    agg: [['AGG (Cummins)', '30–3750 кВА', 'AGG (Cummins)'], ['AGG (Perkins)', '10–2500 кВА', 'AGG (Perkins)'], ['AGG (MTU)', '715–3250 кВА', 'AGG (MTU)']],
    baifa: [['BF-C (Cummins)', '25–2500 кВА', 'BF-C (Cummins)'], ['BF-P (Perkins)', '10–2500 кВА', 'BF-P (Perkins)'], ['BF-M (MTU)', '750–3750 кВА', 'BF-M (MTU)']]
  };
  function render() {
    const id = U.hashParts()[0] || 'salicru'; const b = D.BRANDS.find(x => x.id === id) || D.BRANDS[0];
    const prods = D.PRODUCTS.filter(p => p.brandId === b.id || p.brand === b.name || (b.id === 'exide' && p.brand === 'Exide'));
    const crumbs = [{ name: 'Главная', href: L.home }, { name: 'Бренды', href: L.brands }, { name: b.name }];
    document.getElementById('hero').innerHTML = U.crumbs(crumbs) + `<h1>${b.name}: ${(b.type.charAt(0).toLowerCase() + b.type.slice(1))} в Казахстане</h1><p class="lead">${b.country} · ${b.status}${prods.length ? ' · ' + prods.length + ' моделей в каталоге' : ''}. Поставка со склада в Алматы и под проект, монтаж и сервис по Казахстану.</p><div class="cta"><button class="btn btn-lg btn-kp" data-open-modal data-title="КП на оборудование ${b.name}" data-type="Запрос КП (бренд ${b.name})">Запросить КП</button><a class="btn btn-lg btn-outline-light" href="about.html#certs">Дистрибьюторское письмо</a></div>`;
    document.getElementById('heroArt').innerHTML = (b.logo ? `<div style="background:#fff;border-radius:var(--r);padding:18px 24px;display:inline-block;width:min(300px,80%)"><img src="assets/img/${b.logo}" alt="${b.name}" style="width:100%;max-height:84px;object-fit:contain;display:block"></div>` : `<div class="lg-big">${b.name}</div>`) + `<div style="color:#9fb3c8;margin-top:10px">${b.country}</div>`;
    const ab = ABOUT[b.id] || [b.name + ': ' + b.type, `<p>${b.name} (${b.country}): ${(b.type.charAt(0).toLowerCase() + b.type.slice(1))}. AEC Kazakhstan поставляет оборудование ${b.name} под проект с заводской гарантией, выполняет монтаж, пусконаладку и сервис.</p>`];
    document.getElementById('about').innerHTML = `<h2 style="margin-top:0">${ab[0]}</h2>${ab[1]}`;
    document.getElementById('side').innerHTML = `<h3>${b.name}</h3><span class="badge ${/дистрибьютор/i.test(b.status) ? 'badge-accent' : ''}">${b.status}</span><dl class="kv" style="grid-template-columns:1fr 1fr"><dt>Страна</dt><dd>${b.country}</dd><dt>Оборудование</dt><dd>${b.type}</dd><dt>Гарантия</dt><dd>12–36 мес.</dd></dl><button class="btn btn-kp btn-block" data-open-modal data-title="КП на оборудование ${b.name}" data-type="Запрос КП (бренд ${b.name})">Запросить КП</button><a class="btn btn-ghost btn-block" href="${L.docs}">Datasheet и сертификаты</a>`;
    const lines = LINES[b.id]; document.getElementById('linesSec').style.display = lines ? '' : 'none';
    if (lines) document.getElementById('lines').innerHTML = lines.map(l => { const p = D.PRODUCTS.find(x => x.series === l[2]); return `<a class="line" href="${p ? L.product(p.slug) : L.cat('ibp')}">${p ? `<span style="display:block;height:120px;background:var(--mist);border-radius:var(--r-s);overflow:hidden;margin-bottom:6px;padding:8px">${U.pphoto(p)}</span>` : ''}<b>${l[0]}</b><small>${l[1]}</small></a>`; }).join('');
    document.getElementById('prodTitle').textContent = prods.length ? 'Товары ' + b.name + ' в каталоге' : 'Оборудование ' + b.name + ' под заказ';
    const PRI = { ibp: 0, dgu: 1, stab: 2, sts: 3, akb: 4 }; const pick = prods.slice().sort((a, b) => (PRI[a.cat] - PRI[b.cat]) || a.kva - b.kva).filter((p, i, arr) => arr.findIndex(x => x.series === p.series) === i).slice(0, 8); const show = pick.length >= 8 ? pick : pick.concat(prods.filter(p => !pick.includes(p))).slice(0, 8);
    document.getElementById('prods').innerHTML = prods.length ? show.map(p => U.productCard(p)).join('') : `<p class="muted">Позиции ${b.name} поставляются под проект. Запросите подбор, пришлём спецификацию и КП.</p>`;
    document.getElementById('prodMore').href = prods.length ? L.cat(prods[0].cat, 'brand-' + b.id) : L.cat('dgu');
    const pj = D.PROJECTS.filter(p => p.equipment.some(e => new RegExp(b.name.split(' ')[0], 'i').test(e)));
    document.getElementById('pj').innerHTML = (pj.length ? pj : D.PROJECTS.slice(0, 3)).map(p => `<a class="pj" href="${L.project(p.id)}"><div class="img" style="padding:0;overflow:hidden"><span class="badge badge-navy tag" style="z-index:1">${p.city}, ${p.year}</span>${U.img(p.cover || p.photos[0], p.title, '', 'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" data-ph="bg"')}</div><div class="body"><div class="meta">${p.client}</div><h3>${p.title}</h3><div class="kva">${p.kva}</div></div></a>`).join('');
    document.title = U.fit([b.name + ': ' + (b.type.charAt(0).toLowerCase() + b.type.slice(1)) + ', купить в Казахстане | AEC', b.name + ': ' + (b.type.charAt(0).toLowerCase() + b.type.slice(1)) + ' | AEC', b.name + ' в Казахстане, официальный дистрибьютор | AEC', b.name + ' | AEC']);
    document.querySelector('meta[name=description]').setAttribute('content', U.clip(`${b.name} (${b.country}): ${(b.type.charAt(0).toLowerCase() + b.type.slice(1))}. ${b.status}. Поставка со склада в Алматы и под проект, монтаж и сервис по Казахстану. AEC Kazakhstan.`));
    document.querySelectorAll('script[type="application/ld+json"]').forEach(x => x.remove());
    U.jsonld({ '@context': 'https://schema.org', '@graph': [{ '@type': 'BreadcrumbList', itemListElement: crumbs.map((c, i) => ({ '@type': 'ListItem', position: i + 1, name: c.name, item: c.href ? new URL(c.href, location.href).href : location.href })) }, { '@type': 'Brand', name: b.name, url: location.href }] });
    U.render(); window.scrollTo({ top: 0 });
  }
  render(); window.addEventListener('hashchange', render);
})();
</script>
</body>
</html>
