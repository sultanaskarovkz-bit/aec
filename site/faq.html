<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вопросы и ответы | AEC Kazakhstan</title>
<meta name="description" content="Ответы инженеров AEC: подбор и расчёт ИБП, батареи, обслуживание и ремонт, дизельные генераторы, доставка и оплата, гарантия и документы.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/aec.css">
<link rel="stylesheet" href="assets/pages.css">
<style>
.faq-nav { display: grid; gap: 4px; position: sticky; top: calc(var(--header-h) + 16px); }
.faq-nav a { padding: 8px 12px; border-radius: var(--r-s); color: var(--ink); font-size: 14px; }
.faq-nav a:hover { background: var(--mist); }
.faq-group { margin-bottom: 36px; }
.faq-group h2 { font-size: 22px; margin-bottom: 8px; }
.faq-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 860px) { .faq-layout { grid-template-columns: 1fr; } .faq-nav { position: static; display: flex; flex-wrap: wrap; } }
</style>
</head>
<body>
<div id="app">
<main>
  <section class="page-hero"><div class="grid-bg"></div><div class="wrap" id="hero"></div></section>
  <section class="section-tight"><div class="wrap"><div class="faq-layout"><nav class="faq-nav" id="nav"></nav><div id="groups"></div></div></div></section>
  <section class="section bg-mist"><div class="wrap"><div class="cta-band"><div><h2>Не нашли ответ?</h2><p>Задайте вопрос инженеру: ответим по телефону, e-mail или в WhatsApp в течение рабочего дня.</p></div>
    <form class="form-grid" data-lead novalidate><input type="hidden" name="formType" value="Вопрос эксперту (FAQ)"><div class="field"><label for="qName">Имя <i>*</i></label><input class="input" id="qName" name="name" required><span class="hint"></span></div><div class="field"><label for="qPhone">Телефон или e-mail <i>*</i></label><input class="input" id="qPhone" name="contact" required><span class="hint"></span></div><div class="field full"><label for="qMsg">Вопрос <i>*</i></label><textarea class="textarea" id="qMsg" name="comment" required style="min-height:80px"></textarea><span class="hint"></span></div><label class="check full"><input type="checkbox" required><span>Согласен на обработку персональных данных</span></label><div class="full"><button class="btn btn-kp btn-lg btn-block" type="submit">Задать вопрос</button></div></form></div></div></section>
</main>
</div>
<script src="assets/data.js"></script>
<script src="assets/aec.js"></script>
<script>
(function () {
  const D = AEC, U = AECUI, I = U.icon, L = U.L;
  U.init({ active: 'company' });
  const crumbs = [{ name: 'Главная', href: L.home }, { name: 'Вопросы и ответы' }];
  document.getElementById('hero').innerHTML = U.crumbs(crumbs) + `<h1>Вопросы и ответы</h1><p class="lead">Подбор и расчёт, батареи, сервис, генераторы, доставка, оплата и документы. Ответы полные, без сокращений.</p>`;
  const G = [
    ['podbor', 'Подбор и расчёт', [D.FAQ[1], { q: 'Чем отличается кВА от кВт?', a: 'кВА это полная мощность, кВт активная. Связаны через коэффициент мощности: кВт = кВА × PF. У современных ИБП PF = 1, то есть 20 кВА = 20 кВт. У нагрузки PF обычно 0,8–0,95, поэтому для нагрузки 18 кВт при PF 0,9 нужно 20 кВА.' }, { q: 'Какой ИБП выбрать: модульный или моноблочный?', a: 'Модульный, если планируется рост нагрузки, нужно резервирование N+1 и обслуживание без остановки. Моноблочный дешевле при фиксированной нагрузке до 40 кВА.' }, { q: 'Нужен ли трёхфазный ИБП?', a: 'От 10 кВА и при трёхфазной нагрузке. До 10 кВА с однофазной нагрузкой достаточно 1/1. Есть варианты 3/1: трёхфазный вход, однофазный выход.' }]],
    ['akb', 'Батареи', [D.FAQ[0], D.FAQ[3], { q: 'Можно ли заменить часть батарей?', a: 'Нет, заменяют всю строку: новые батареи в паре со старыми быстро деградируют и теряют ёмкость.' }, { q: 'Какая температура нужна батареям?', a: '20–25 °C. Каждые 10 °C выше сокращают срок службы вдвое. Батарейное помещение или шкаф с вентиляцией обязательны.' }]],
    ['service', 'Обслуживание и ремонт', [D.FAQ[2], D.FAQ[4], { q: 'Ремонтируете ли ИБП других поставщиков?', a: 'Да, сервисная служба работает с ИБП и ДГУ любых брендов: APC, Eaton, Vertiv, Socomec, Riello, Huawei и другими.' }, { q: 'Как быстро приедет инженер?', a: 'По Алматы в день обращения в рабочее время, по договору до 4 часов. В регионы 1–5 дней.' }]],
    ['dgu', 'Дизельные генераторы', [{ q: 'Как выбрать мощность ДГУ?', a: 'По сумме нагрузки с учётом пусковых токов двигателей, режима (резервный ESP или основной PRP), высоты и температуры. Если ДГУ питает ИБП, его номинал берут в 1,5 раза выше мощности ИБП.' }, { q: 'Сколько топлива расходует ДГУ?', a: 'Около 0,2–0,25 л на кВт·ч при 75 % нагрузки. ДГУ 100 кВт на 75 % нагрузки расходует 16–20 л/ч.' }, { q: 'Нужен ли АВР?', a: 'Для автоматического резервирования да: АВР запускает ДГУ при пропадании сети и переключает нагрузку за 10–15 секунд.' }, { q: 'Какие сроки поставки ДГУ?', a: 'Типовые 8–12 недель, контейнерные с АВР 10–14 недель.' }]],
    ['delivery', 'Доставка и оплата', [D.FAQ[7], { q: 'Какие условия оплаты?', a: 'Для юридических лиц: безналичный расчёт по счёту, предоплата для складских позиций, поэтапная оплата для проектных поставок. Работаем по договору.' }, { q: 'Сколько идёт доставка?', a: 'Складские позиции: Алматы в день оплаты, Астана и Шымкент 1–2 дня, Атырау и Актобе 3–4 дня. Проектное оборудование напрямую на объект.' }, { q: 'Можно ли забрать самовывозом?', a: 'Да, со склада в Алматы, ул. Чаплина 71/66, по будням 9:00–18:00 по предварительному звонку.' }]],
    ['docs', 'Гарантия и документы', [D.FAQ[5], D.FAQ[6], { q: 'Какая гарантия на оборудование?', a: 'ИБП Salicru и Kehua 24 месяца, модульные Kehua MR33 36 месяцев, Tescom 24 месяца, ДГУ 12 месяцев или 1000 моточасов, батареи 12–24 месяца. Гарантия заводская при соблюдении условий эксплуатации.' }, { q: 'Даёте ли документы для тендера?', a: 'Сертификаты ЕАЭС, дистрибьюторские письма, паспорта, референс-лист, реквизиты. Пришлём одним архивом по запросу.' }]]
  ];
  document.getElementById('nav').innerHTML = G.map(g => `<a href="#${g[0]}" onclick="document.getElementById('${g[0]}').scrollIntoView({behavior:'smooth'});return false;">${g[1]}</a>`).join('');
  document.getElementById('groups').innerHTML = G.map(g => `<div class="faq-group" id="${g[0]}"><h2>${g[1]}</h2><div class="acc">${g[2].map(q => `<details><summary>${q.q}<span class="pm">${I('plus')}</span></summary><div class="acc-body">${q.a}</div></details>`).join('')}</div></div>`).join('');
  U.jsonld({ '@context': 'https://schema.org', '@graph': [{ '@type': 'BreadcrumbList', itemListElement: crumbs.map((c, i) => ({ '@type': 'ListItem', position: i + 1, name: c.name, item: c.href ? new URL(c.href, location.href).href : location.href })) }, { '@type': 'FAQPage', mainEntity: G.flatMap(g => g[2]).map(q => ({ '@type': 'Question', name: q.q, acceptedAnswer: { '@type': 'Answer', text: q.a } })) }] });
})();
</script>
</body>
</html>
