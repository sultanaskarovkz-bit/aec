  /* ---------- Состояние ---------- */
  function parse() {
    const parts = U.hashParts();

    let i = 0;

    if (parts[i] && cat.subs.find(s => s.id === parts[i])) { st.sub = parts[i]; i++; }
    for (; i < parts.length; i++) {

      else if (k === 'kvamin') { const n = parseFloat(v.replace('-', '.')); if (n >= 0) st.min = n; }
      else if (k === 'kvamax') { const n = parseFloat(v.replace('-', '.')); if (n > 0) st.max = n; }
      else if (k === 'brand') st.brands.push(v);
      else if (k === 'phase') st.phase = v; else if (k === 'form') st.form = v; else if (k === 'arch') st.arch = v; else if (k === 'bat') st.bat = v;
      else if (k === 'stock') st.stock = v === 'in'; else if (k === 'tech') st.tech = v; else if (k === 'engine') st.engine = v;
      else if (k === 'sort' && SORT[v]) st.sort = v; else if (k === 'view' && v === 'list') st.view = 'list';
    }
    return st;
  }
  function hashOf(st) {
    const a = [st.cat]; if (st.sub) a.push(st.sub);

    if (st.kva != null) a.push('kva-' + num(st.kva)); if (st.min != null) a.push('kvamin-' + num(st.min)); if (st.max != null) a.push('kvamax-' + num(st.max));
    st.brands.forEach(b => a.push('brand-' + b));
    if (st.phase) a.push('phase-' + st.phase); if (st.form) a.push('form-' + st.form); if (st.arch) a.push('arch-' + st.arch); if (st.bat) a.push('bat-' + st.bat);
    if (st.stock) a.push('stock-in'); if (st.tech) a.push('tech-' + st.tech); if (st.engine) a.push('engine-' + st.engine);
    if (st.sort !== 'pop') a.push('sort-' + st.sort); if (st.view === 'list') a.push('view-list');

  const F = {

    phase: p => !st.phase || phaseKey(p) === st.phase,
    form: p => !st.form || formMatch(p, st.form),
    arch: p => !st.arch || archKey(p) === st.arch,
    bat: p => !st.bat || batKey(p) === st.bat,

  /* ---------- Имена ---------- */
  function names() {

  }

      `<section class="section"><div class="wrap"><div class="split seo-split"><div class="seo">${SEO[st.cat] || ''}</div><div><h2 style="font-size:clamp(22px,2.4vw,30px)">Вопросы и ответы</h2><p class="muted" style="margin:10px 0 18px">Коротко о выборе и эксплуатации. <a href="${L.faq}">Все вопросы</a></p><div class="acc">${faqs.map(q => `<details><summary>${esc(q[0])}<span class="pm">${I('plus')}</span></summary><div class="acc-body">${esc(q[1])}</div></details>`).join('')}</div></div></div></div></section>` +
      `<section class="section" style="padding-top:0"><div class="wrap"><div class="cta-band"><div><h2>Помощь в подборе: ${esc(n.short)}</h2><p>Укажите нагрузку, нужную автономию и город объекта или приложите спецификацию из тендера. Инженер проверит расчёт, предложит 2–3 варианта и пришлёт КП в течение рабочего дня.</p>
        <div style="margin-top:22px;display:grid;gap:10px;font-size:15px"><span style="display:flex;gap:10px;align-items:center"><span style="color:var(--accent);display:flex">${I('phone')}</span><a href="tel:+${D.CONTACT.phoneRaw}" style="color:#fff;font-family:var(--font-display);font-size:20px;font-weight:600">${D.CONTACT.phone}</a></span><span style="display:flex;gap:10px;align-items:center"><span style="color:var(--accent);display:flex">${I('mail')}</span><a href="mailto:${D.CONTACT.email}" style="color:#d7e3f0">${D.CONTACT.email}</a></span><a class="btn btn-sm btn-outline-light" style="justify-self:start" href="${L.calc}">Калькулятор подбора</a></div></div>
        ${leadForm('Помощь в подборе (' + n.title + ')', '', 'Например: ' + n.short + ', нагрузка 18 кВт, автономия 30 минут, Астана')}</div></div></section>`;

    bindCat(res, total);
    const ld = [ldCrumbs(crumbsFor(n)), { '@type': 'ItemList', name: n.h1, numberOfItems: total, itemListElement: res.slice(0, 24).map((p, i) => ({ '@type': 'ListItem', position: i + 1, url: new URL(L.product(p.slug), location.href).href, name: p.name })) }];
    if (faqs.length) ld.push({ '@type': 'FAQPage', mainEntity: faqs.map(q => ({ '@type': 'Question', name: q[0], acceptedAnswer: { '@type': 'Answer', text: q[1] } })) });
    U.jsonld({ '@context': 'https://schema.org', '@graph': ld });
  }

  function plural(n, a, b, c) { const m = n % 100, d = n % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; }
  function kvaIntro(n, res) {
    const brands = [...new Set(res.map(p => p.brand))], priced = res.filter(p => p.price).map(p => p.price), inStock = res.filter(p => p.stock === 'in').length;
    const what = n.short;
    return `${what} ${fmtN(st.kva)} ${n.unit}: цена, модели, подбор. В каталоге ${res.length} ${plural(res.length, 'модель', 'модели', 'моделей')}${brands.length ? ' ' + brands.join(', ') : ''}${priced.length ? ', складские позиции от ' + fmtN(Math.min(...priced)) + ' ₸' : ''}${inStock ? ', ' + inStock + ' ' + plural(inStock, 'модель', 'модели', 'моделей') + ' в наличии в Алматы' : ''}. Подберём по нагрузке, автономии и условиям объекта, пришлём КП в течение рабочего дня.`;
  }
  function activeCount() { return (st.kva != null ? 1 : 0) + (st.min != null || st.max != null ? 1 : 0) + st.brands.length + ['phase', 'form', 'arch', 'bat', 'tech', 'engine'].filter(k => st[k]).length + (st.stock ? 1 : 0); }

  /* ---------- Панель фильтров ---------- */
  function renderPanel(total) {
    const cat = D.cat(st.cat), unit = D.unit(st.cat), all = catProducts();
    const lo = Math.min(...all.map(p => p.kva)), hi = Math.max(...all.map(p => p.kva));
    const groups = [];
    // мощность
    const curMin = st.min != null ? st.min : lo, curMax = st.max != null ? st.max : hi;
    const toT = v => Math.round(Math.log(Math.max(lo, Math.min(hi, v)) / lo) / Math.log(hi / lo) * 1000);
    const powerTitle = st.cat === 'akb' ? 'Ёмкость C10, А·ч' : st.cat === 'sts' ? 'Номинальный ток, А' : 'Мощность, кВА';
    groups.push(`<div class="fgroup" data-g="range"><h3>${powerTitle}</h3>
      ${st.kva != null ? `<p class="small muted" style="margin-bottom:8px">Выбрана точная мощность ${fmtN(st.kva)} ${esc(unit)}. <a href="#" data-clear="kva">Показать диапазон</a></p>` : ''}
      <div class="rng"><input class="input" type="number" id="rMin" min="${lo}" max="${hi}" step="any" value="${curMin}" aria-label="От"><span class="dash">—</span><input class="input" type="number" id="rMax" min="${lo}" max="${hi}" step="any" value="${curMax}" aria-label="До"></div>
      <div class="dr" id="dr"><div class="track"></div><div class="fill" id="drFill"></div><input type="range" id="drA" min="0" max="1000" value="${toT(curMin)}" aria-label="Минимум"><input type="range" id="drB" min="0" max="1000" value="${toT(curMax)}" aria-label="Максимум"></div>
      <div class="rng-scale"><span>${fmtN(lo)}</span><span>${fmtN(hi)} ${esc(unit)}</span></div></div>`);
    // бренд
    const bc = count(apply('brand'), p => p.brandId);
    const brandOpts = D.BRANDS.filter(b => bc[b.id]);
    if (brandOpts.length) groups.push(group('Бренд', brandOpts.map(b => chk('brand', b.id, b.name, bc[b.id], st.brands.includes(b.id)))));
    // фазность
    if (['ibp', 'stab', 'sts'].includes(st.cat)) { const pc = count(apply('phase'), phaseKey); const ks = Object.keys(pc).sort(); if (ks.length) groups.push(group('Фазность', ks.map(k => chk('phase', k, PHASE_LABEL[k] || k, pc[k], st.phase === k, true)))); }
    // двигатель
    if (st.cat === 'dgu') { const base = apply('engine'); const ec = count(base, engineKey); const lbl = {}; base.forEach(p => lbl[engineKey(p)] = p.spec['Двигатель']); const ks = Object.keys(ec).sort(); if (ks.length) groups.push(group('Двигатель', ks.map(k => chk('engine', k, lbl[k], ec[k], st.engine === k, true)))); }
    // исполнение / напряжение
    { const base = apply('form'); const opts = FORM_OPTS.map(o => ({ o, n: base.filter(p => o.re.test(p.form || '')).length })).filter(x => x.n); if (opts.length) groups.push(group(st.cat === 'akb' ? 'Напряжение' : 'Исполнение', opts.map(x => chk('form', x.o.id, x.o.label, x.n, st.form === x.o.id, true)))); }
    // архитектура, батареи
    if (st.cat === 'ibp') {
      const ac = count(apply('arch'), archKey); const ak = Object.keys(ac); if (ak.length) groups.push(group('Архитектура', ak.sort().map(k => chk('arch', k, ARCH_LABEL[k], ac[k], st.arch === k, true))));
      const bk = count(apply('bat'), batKey); const bks = Object.keys(bk); if (bks.length) groups.push(group('Батареи', bks.sort().map(k => chk('bat', k, BAT_LABEL[k], bk[k], st.bat === k, true))));
    }
    // технология / тип
    if (['akb', 'stab'].includes(st.cat)) { const base = apply('tech'); const tc = count(base, techKey); const lbl = {}; base.forEach(p => lbl[techKey(p)] = techLabel(p)); const ks = Object.keys(tc).sort(); if (ks.length) groups.push(group(st.cat === 'akb' ? 'Технология' : 'Тип регулирования', ks.map(k => chk('tech', k, lbl[k], tc[k], st.tech === k, true)))); }
    // наличие
    const sc = apply('stock').filter(p => p.stock === 'in').length;
    groups.push(group('Наличие', [chk('stock', 'in', 'В наличии в Алматы', sc, st.stock)]));
    return `<aside class="fpanel" id="fpanel" aria-label="Фильтры">
      <div class="fpanel-head"><h2>Фильтры</h2>${activeCount() ? `<a href="#" data-reset>Сбросить</a>` : ''}<button class="btn-icon" type="button" data-close-filters aria-label="Закрыть">${I('close')}</button></div>
      <div class="fpanel-body" id="fbody">${groups.join('')}</div>
      <div class="fpanel-foot"><button class="btn btn-primary btn-block" type="button" data-close-filters>Показать ${total} ${plural(total, 'модель', 'модели', 'моделей')}</button></div>
    </aside>`;
  }
  const group = (title, items) => `<div class="fgroup"><h3>${esc(title)}</h3>${items.join('')}</div>`;
  const chk = (k, v, label, n, on, single) => `<label class="check"><input type="checkbox" data-f="${k}" value="${esc(v)}"${on ? ' checked' : ''}${single ? ' data-single' : ''}><span><em>${esc(label)}</em><span class="cnt">${n}</span></span></label>`;

  function renderChips(n) {
    const unit = n.unit, c = [];
    const chip = (label, k, v) => `<span class="chip">${esc(label)}<button type="button" data-rm="${k}" data-v="${esc(v || '')}" aria-label="Убрать фильтр">${I('close')}</button></span>`;
    if (st.kva != null) c.push(chip(fmtN(st.kva) + ' ' + unit, 'kva'));
    if (st.min != null || st.max != null) c.push(chip((st.min != null ? 'от ' + fmtN(st.min) : '') + (st.max != null ? ' до ' + fmtN(st.max) : '') + ' ' + unit, 'range'));
    st.brands.forEach(b => c.push(chip(brandName(b), 'brand', b)));
    if (st.phase) c.push(chip(PHASE_LABEL[st.phase] || st.phase, 'phase'));
    if (st.form) { const o = FORM_OPTS.find(x => x.id === st.form); c.push(chip(o ? o.label : st.form, 'form')); }
    if (st.arch) c.push(chip(ARCH_LABEL[st.arch] || st.arch, 'arch'));
    if (st.bat) c.push(chip(BAT_LABEL[st.bat] || st.bat, 'bat'));
    if (st.tech) { const p = catProducts().find(p => techKey(p) === st.tech); c.push(chip(p ? techLabel(p) : st.tech, 'tech')); }
    if (st.engine) { const p = catProducts().find(p => engineKey(p) === st.engine); c.push(chip(p ? p.spec['Двигатель'] : st.engine, 'engine')); }
    if (st.stock) c.push(chip('В наличии', 'stock'));
    if (c.length) c.push(`<a href="#" class="reset" data-reset>Сбросить всё</a>`);
    return c.join('');
  }
  function clearKey(k, v) {
    if (k === 'kva') st.kva = null; else if (k === 'range') { st.min = null; st.max = null; } else if (k === 'brand') st.brands = st.brands.filter(b => b !== v); else if (k === 'stock') st.stock = false; else st[k] = null;
  }
  function resetAll() { Object.assign(st, { kva: null, min: null, max: null, brands: [], phase: null, form: null, arch: null, bat: null, stock: false, tech: null, engine: null }); }

  /* ---------- События ---------- */
  function bindCat(res, total) {
    const body = document.getElementById('body');
    const panel = document.getElementById('fpanel'), overlay = document.querySelector('[data-overlay]');
    const openF = () => { panel.classList.add('open'); overlay.classList.add('open'); };
    const closeF = () => { panel.classList.remove('open'); overlay.classList.remove('open'); };
    body.querySelectorAll('[data-open-filters]').forEach(b => b.addEventListener('click', openF));
    body.querySelectorAll('[data-close-filters]').forEach(b => b.addEventListener('click', closeF));
    body.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); resetAll(); commit(); }));
    body.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); clearKey(b.dataset.clear); commit(); }));
    body.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { clearKey(b.dataset.rm, b.dataset.v); commit(); }));
    body.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.view; commit(); }));
    const sel = document.getElementById('sortSel'); if (sel) sel.addEventListener('change', () => { st.sort = sel.value; commit(); });
    body.querySelectorAll('[data-more]').forEach(b => b.addEventListener('click', () => { to = Math.min(total, to + PER); render(); }));
    body.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { from = +b.dataset.page * PER; to = from + PER; render(); const t = document.querySelector('.toolbar'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    body.querySelectorAll('[data-open-modal]').forEach(b => b.addEventListener('click', () => U.openModal({ title: b.dataset.title, type: b.dataset.type, product: b.dataset.product, sub: b.dataset.sub })));
    body.querySelectorAll('form[data-lead]').forEach(f => U.bindForm(f));
    // чекбоксы
    const fb = document.getElementById('fbody');
    fb.addEventListener('change', e => {
      const inp = e.target; if (!inp.matches('input[data-f]')) return;
      const k = inp.dataset.f, v = inp.value, scrollTop = fb.scrollTop;
      if (k === 'brand') { st.brands = inp.checked ? st.brands.concat(v) : st.brands.filter(b => b !== v); }
      else if (k === 'stock') st.stock = inp.checked;
      else st[k] = inp.checked ? v : null;
      const wasOpen = panel.classList.contains('open');
      commit();
      if (wasOpen) { document.getElementById('fpanel').classList.add('open'); document.getElementById('fbody').scrollTop = scrollTop; }
    });
    // диапазон
    const all = catProducts(), lo = Math.min(...all.map(p => p.kva)), hi = Math.max(...all.map(p => p.kva));
    const a = document.getElementById('drA'), b = document.getElementById('drB'), fill = document.getElementById('drFill'), iMin = document.getElementById('rMin'), iMax = document.getElementById('rMax');
    const nice = v => v < 10 ? Math.round(v * 10) / 10 : v < 100 ? Math.round(v) : v < 1000 ? Math.round(v / 5) * 5 : Math.round(v / 50) * 50;
    const toVal = t => nice(lo * Math.pow(hi / lo, t / 1000));
    const toT = v => Math.round(Math.log(Math.max(lo, Math.min(hi, v)) / lo) / Math.log(hi / lo) * 1000);
    const paint = () => { let x = +a.value, y = +b.value; if (x > y) { if (document.activeElement === a) { y = x; b.value = y; } else { x = y; a.value = x; } } fill.style.left = x / 10 + '%'; fill.style.width = (y - x) / 10 + '%'; };
    const commitRange = (mn, mx) => { mn = Math.max(lo, Math.min(hi, mn)); mx = Math.max(lo, Math.min(hi, mx)); if (mn > mx) [mn, mx] = [mx, mn]; st.min = mn <= lo ? null : mn; st.max = mx >= hi ? null : mx; st.kva = null; const wasOpen = panel.classList.contains('open'); const s = fb.scrollTop; commit(); if (wasOpen) { document.getElementById('fpanel').classList.add('open'); document.getElementById('fbody').scrollTop = s; } };
    paint();
    [a, b].forEach(r => { r.addEventListener('input', () => { paint(); iMin.value = toVal(+a.value); iMax.value = toVal(+b.value); }); r.addEventListener('change', () => commitRange(toVal(+a.value), toVal(+b.value))); });
    [iMin, iMax].forEach(inp => { inp.addEventListener('change', () => { const mn = parseFloat(iMin.value), mx = parseFloat(iMax.value); if (isNaN(mn) || isNaN(mx)) return; a.value = toT(mn); b.value = toT(mx); paint(); commitRange(mn, mx); }); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } }); });
  }

  document.querySelector('[data-overlay]').addEventListener('click', () => { const p = document.getElementById('fpanel'); if (p) p.classList.remove('open'); });
  window.addEventListener('hashchange', () => { const prev = st.cat + '.' + st.sub; st = parse(); render(st.cat + '.' + st.sub !== prev); });
  render();
})();
</script>
</body>
</html>
